<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel</title>
<meta name="description" content="Ferðaáætlun: gisting, flug, afþreying og allt sem er bókað, dag fyrir dag, í dagatali og á korti.">
<meta name="robots" content="noindex">
<link rel="manifest" href="/travel/manifest.json">
<meta name="theme-color" content="#0F7C8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Travel">
<meta property="og:type" content="website">
<meta property="og:site_name" content="multabene.is">
<meta property="og:title" content="Travel">
<meta property="og:description" content="Ferðaáætlun: gisting, flug, afþreying og allt sem er bókað, dag fyrir dag, í dagatali og á korti.">
<meta property="og:url" content="https://www.multabene.is/travel/">
<meta property="og:image" content="https://www.multabene.is/mbalogo2.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Þemu skipta um þessar breytur, sjá THEMES í kóðanum */
  :root{
    --bg:#F3F6F6;
    --panel:#FFFFFF;
    --panel-2:#E9EFF0;
    --line:#D5DEE0;
    --fg:#17262B;
    --dim:#5F7378;
    --accent:#0F7C8C;
    --accent-soft:#D7EDF0;
    --hotel:#4F5BD5;
    --flight:#3A4A52;
    --move:#C98A1B;
    --act:#E0694B;
    --note:#7A8C92;
    --danger:#B8524A;
    --display:"Fraunces",Georgia,serif;
    --body:"Karla",-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 70px;}
  h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;}
  button{font:inherit;color:inherit;cursor:pointer;}
  input,select,textarea{font:inherit;}
  a{color:var(--accent);}
  [hidden]{display:none!important;}

  /* ---------- haus ---------- */
  header.hero{position:relative;padding:26px 0 18px;overflow:hidden;}
  header.hero .motif{position:absolute;right:-10px;top:0;height:100%;width:min(46%,320px);opacity:.9;pointer-events:none;}
  header.hero .motif svg{width:100%;height:100%;display:block;}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .eyebrow a{color:var(--accent);text-decoration:none;}
  .eyebrow a:hover{text-decoration:underline;}
  h1{font-size:clamp(30px,6vw,44px);font-weight:700;line-height:1;letter-spacing:-.02em;position:relative;max-width:70%;overflow-wrap:anywhere;}
  h1 small{display:block;font-family:var(--body);font-size:15px;font-weight:400;color:var(--dim);letter-spacing:0;margin-top:8px;}
  @media (max-width:560px){ h1{max-width:100%;} header.hero .motif{opacity:.35;} }
  .userbar{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dim);margin:14px 0 0;position:relative;flex-wrap:wrap;}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}

  .tabrow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin:0 0 18px;}
  nav.tabs{position:relative;display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0;flex:1;scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs.more{mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);}
  .tabrow .btn{flex:0 0 auto;margin-left:auto;}
  @media (max-width:640px){ .tabrow .btn{display:none;} }
  @media (min-width:641px){ .fab{display:none;} }
  nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 10px;color:var(--dim);font-weight:500;white-space:nowrap;font-size:15px;}
  nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);}
  nav.tabs button .cnt,nav.tabs button .n{display:inline-block;min-width:18px;padding:1px 6px;border-radius:999px;font-size:11px;font-weight:600;margin-left:5px;text-align:center;line-height:1.4;vertical-align:1px;font-variant-numeric:tabular-nums;}
  nav.tabs button .cnt{background:var(--panel-2);color:var(--dim);}
  nav.tabs button[aria-selected="true"] .cnt{background:var(--accent-soft);color:var(--accent);}
  nav.tabs button .n{background:var(--act);color:#fff;font-weight:700;}

  /* ---------- spjöld og hnappar ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;}
  .card h2{font-size:20px;margin:0 0 6px;}
  .help{color:var(--dim);font-size:14px;margin:0;}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500;}
  .btn.ghost:hover{border-color:var(--dim);}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);font-weight:500;}
  .btn.small{padding:6px 10px;font-size:13px;border-radius:8px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .status{font-size:13px;color:var(--dim);min-height:1.3em;margin:8px 0 0;}
  .status.err{color:var(--danger);}
  .gbtn{display:flex;align-items:center;gap:10px;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-weight:500;width:100%;max-width:360px;}
  .gbtn:hover{border-color:var(--accent);}
  .glogo{width:18px;height:18px;border-radius:50%;background:conic-gradient(#4285F4 0 25%,#34A853 0 50%,#FBBC05 0 75%,#EA4335 0);flex:0 0 18px;}
  .notice{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin:0 0 14px;}
  .notice.warn{background:#FFF1D6;color:#5A3D07;}

  /* ---------- eyðublöð ---------- */
  .form{display:grid;gap:12px;grid-template-columns:1fr 1fr;}
  .form label{display:grid;gap:4px;font-size:13px;color:var(--dim);min-width:0;}
  .form label.full{grid-column:1 / -1;}
  .form input,.form select,.form textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:9px 11px;font-size:16px;}
  .form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .form .row{grid-column:1 / -1;}
  @media (max-width:560px){.form{grid-template-columns:1fr;}}
  .form .opts{grid-column:1 / -1;display:grid;gap:8px;}
  .form label.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;color:var(--fg);cursor:pointer;}
  .form label.opt input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--accent);flex:0 0 18px;}
  .form label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);}
  .opt small{display:block;color:var(--dim);font-size:13px;}
  .themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;grid-column:1 / -1;}
  .theme{border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--t-bg,#fff);color:var(--t-fg,#000);text-align:left;display:grid;gap:6px;}
  .theme[aria-pressed="true"]{border-color:var(--t-accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--t-accent) 30%,transparent);}
  .theme b{font-family:var(--display);font-size:15px;}
  .theme i{display:block;height:8px;border-radius:4px;background:var(--t-accent);}
  gmp-place-autocomplete{width:100%;display:block;--gmp-mat-color-surface:var(--panel-2);--gmp-mat-color-on-surface:var(--fg);}

  /* ---------- listar ---------- */
  .trips{list-style:none;margin:0;padding:0;display:grid;gap:8px;}
  .trips li{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--panel-2);border-radius:10px;padding:12px 14px;}
  .trips li a{color:var(--fg);text-decoration:none;font-weight:700;display:block;}
  .trips li small{color:var(--dim);display:block;}

  /* ---------- dagur fyrir dag ---------- */
  .days{display:grid;grid-template-columns:64px minmax(0,1fr) 180px;gap:14px 12px;align-items:start;}
  .days .date{position:sticky;top:0;align-self:start;text-align:center;padding:6px 0;}
  .days .date b{font-family:var(--display);font-size:26px;display:block;line-height:1;}
  .days .date span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:block;margin-top:4px;}
  .days .date.we b{color:var(--act);}
  .days .date .wx{display:block;font-size:12px;letter-spacing:0;text-transform:none;color:var(--dim);margin-top:5px;line-height:1.25;}
  .days .date .wx b{display:inline;font-family:var(--body);font-size:12px;color:var(--fg);font-weight:600;}
  .leg{font-size:12px;color:var(--dim);padding:0 0 0 16px;margin:-3px 0;}
  .leg:empty{display:none;}
  .item .meta .open{color:var(--accent);}
  .item .meta .closed{color:var(--danger);font-weight:600;}
  .days .date.today b{color:var(--accent);}
  .items{display:grid;gap:8px;min-width:0;}
  .stay{grid-column:3;align-self:stretch;background:color-mix(in srgb,var(--hotel) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--hotel) 35%,var(--line));border-left:4px solid var(--hotel);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:3px;min-width:0;}
  .stay .kind{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--hotel);font-weight:700;}
  .stay b.name{font-weight:700;font-size:14px;overflow-wrap:anywhere;}
  .stay .d{color:var(--dim);overflow-wrap:anywhere;}
  .stay .full{display:contents;}
  .stay .short{display:none;}
  .stay{overflow:hidden;}
  .stay .acts{display:flex;flex-direction:column;gap:4px;margin-top:4px;align-items:flex-start;}
  .stayhead{grid-column:3;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:6px 0 0;}
  @media (max-width:640px){
    .days{grid-template-columns:50px minmax(0,1fr) 36px;gap:12px 8px;}
    .days .date b{font-size:22px;}
    .stay{padding:10px 0;align-items:center;justify-content:flex-start;cursor:pointer;border-left-width:3px;}
    .stay .full{display:none;}
    .stay .short{display:block;writing-mode:vertical-rl;text-orientation:mixed;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;max-height:100%;color:var(--hotel);}
    .stayhead{display:none;}
  }
  .item{display:grid;grid-template-columns:4px 1fr auto;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 0;overflow:hidden;min-width:0;}
  .item i.bar{display:block;border-radius:0 3px 3px 0;background:var(--c);}
  .item .main{min-width:0;}
  .item .kind{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);font-weight:700;}
  .item .title{font-weight:700;margin:2px 0;overflow-wrap:anywhere;}
  .item .meta{font-size:14px;color:var(--dim);overflow-wrap:anywhere;}
  .item .meta span+span::before{content:" · ";}
  .item .time{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap;text-align:right;font-size:14px;}
  .item .time small{display:block;color:var(--dim);font-weight:400;}

  .item .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;}
  .conf{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--panel-2);padding:1px 6px;border-radius:5px;}
  .maplink{font-size:13px;color:var(--accent);text-decoration:none;font-weight:500;}
  .maplink:hover{text-decoration:underline;}
  .linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:2px;}
  .empty{color:var(--dim);font-size:14px;padding:8px 0;margin:0;}
  .fab{position:fixed;right:16px;bottom:18px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:999px;padding:12px 18px;}

  /* ---------- dagatal ---------- */
  .months{display:grid;gap:22px;}
  .cal-head h3{font-size:20px;margin:0 0 8px;}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:0 0 3px;}
  .dow span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:center;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal .c{min-height:76px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;font-size:12px;min-width:0;cursor:pointer;}
  .cal .c.pad{background:transparent;border-color:transparent;cursor:default;}
  .cal .c.out{opacity:.35;}
  .cal .c .n{font-weight:700;font-size:13px;}
  .cal .c .n.we{color:var(--act);}
  .cal .stay{height:6px;border-radius:0;background:var(--hotel);margin:4px -5px 0 -5px;}
  .cal .stay.start{margin-left:4px;border-radius:3px 0 0 3px;}
  .cal .stay.end{margin-right:4px;border-radius:0 3px 3px 0;}
  .cal .stay.start.end{margin-inline:4px;border-radius:3px;}
  .cal .ev{display:flex;gap:4px;align-items:center;margin-top:3px;line-height:1.2;min-width:0;}
  .cal .ev i{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--c);}
  .cal .ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--dim);margin:12px 0 0;}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:-1px;}
  @media (max-width:560px){ .cal .c{min-height:58px;} .cal .ev span{display:none;} .cal .ev{margin-top:4px;} }

  /* ---------- kort ---------- */
  #gmap{width:100%;height:min(70vh,520px);border-radius:14px;border:1px solid var(--line);background:var(--panel-2);}
  .pinlist{display:grid;gap:4px;margin:12px 0 0;}
  .pin{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 8px;border-radius:8px;background:none;border:0;text-align:left;width:100%;}
  .pin:hover,.pin.on{background:var(--panel-2);}
  .pin i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:0 0 12px;}
  .pin b{font-weight:500;overflow-wrap:anywhere;}
  .pin small{color:var(--dim);margin-left:auto;white-space:nowrap;}

  /* ---------- gisting ---------- */
  .hotels{display:grid;gap:10px;}
  .hotel{display:grid;grid-template-columns:1fr auto;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--hotel);border-radius:12px;padding:12px 14px;}
  .hotel h3{font-size:18px;overflow-wrap:anywhere;}
  .hotel .nights{text-align:right;font-variant-numeric:tabular-nums;}
  .hotel .nights b{font-family:var(--display);font-size:26px;display:block;line-height:1;}
  .hotel .nights span{font-size:12px;color:var(--dim);}
  .hotel .io{font-size:14px;color:var(--dim);margin-top:4px;overflow-wrap:anywhere;}
  .hotel .io b{color:var(--fg);font-weight:500;}

  /* ---------- gluggi ---------- */
  dialog{border:0;border-radius:16px;padding:0;max-width:640px;width:calc(100% - 24px);background:var(--panel);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.3);}
  dialog::backdrop{background:rgba(20,30,34,.45);}
  dialog .inner{padding:18px;max-height:85vh;overflow:auto;}
  dialog h2{font-size:22px;margin:0 0 12px;padding-right:36px;}
  /* x í horninu: langir gluggar (Hjálp) sýna ekki endilega Loka neðst */
  .dlgx{position:absolute;top:10px;right:10px;width:34px;height:34px;border:0;border-radius:50%;background:var(--panel-2);color:var(--fg);font-size:22px;line-height:1;cursor:pointer;z-index:2;}
  .dlgx:hover{background:var(--line);}
  .share-box{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--panel-2);padding:8px 10px;border-radius:8px;overflow-wrap:anywhere;margin:6px 0 8px;}

  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:999px;padding:9px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:20;}
  .toast.show{opacity:1;}
  .foot{color:var(--dim);font-size:13px;margin:26px 0 0;}
  .foot .footlinks{display:block;margin-top:6px;}
  .viewseg{display:flex;justify-content:flex-end;margin:-4px 0 14px;}
  .seg{display:inline-flex;background:var(--panel-2);border-radius:999px;padding:3px;gap:2px;}
  .seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--dim);font-weight:500;white-space:nowrap;transition:background .15s,color .15s;}
  .seg button:hover{color:var(--fg);}
  .seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .pack{display:grid;gap:18px;}
  .pack .cat h3{font-size:16px;margin:0 0 8px;font-family:var(--display);display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .pack .cat h3 small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--dim);background:var(--panel-2);padding:2px 9px;border-radius:999px;white-space:nowrap;}
  .pack .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;}
  .pack .grid.wide{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
  .pack .pi{position:relative;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:color-mix(in srgb,var(--panel) 82%,var(--panel-2));border:1px solid var(--line);border-radius:10px;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .pack .pi.done{background:var(--panel-2);}
  .pack .pi input[type=checkbox]{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:0 0 20px;}
  .pack .pi label{flex:1;min-width:0;overflow-wrap:break-word;cursor:pointer;line-height:1.35;}
  .pack .pi.done label{text-decoration:line-through;color:var(--dim);}
  .pack .pi small{color:var(--dim);margin-left:6px;font-size:12px;}
  .pack .pi .ed{background:none;border:0;color:var(--dim);font-size:13px;padding:0 4px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;line-height:1.5;}
  .pack .pi .ed:hover{color:var(--accent);}
  .pack .pi .x{background:none;border:0;color:var(--dim);font-size:18px;line-height:1;padding:0 4px;cursor:pointer;}
  .pack .pi .x:hover{color:var(--danger);}
  @media (hover:hover){
    .pack .pi .ed,.pack .pi .x{position:absolute;top:6px;opacity:0;transition:opacity .15s;background:color-mix(in srgb,var(--panel) 82%,var(--panel-2));border-radius:6px;}
    .pack .pi .x{right:6px;padding:2px 6px;}
    .pack .pi .ed{right:30px;padding:2px 4px;}
    .pack .pi.done .ed,.pack .pi.done .x{background:var(--panel-2);}
    .pack .pi:hover .ed,.pack .pi:hover .x,.pack .pi:focus-within .ed,.pack .pi:focus-within .x{opacity:1;}
    .pack .pi label{padding-right:56px;}
  }
  .progress{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin:6px 0 0;}
  .progress i{display:block;height:100%;background:var(--accent);}
  .clock{display:inline-flex;gap:14px;font-size:13px;color:var(--dim);margin-left:12px;font-variant-numeric:tabular-nums;}
  .clock b{color:var(--fg);font-weight:700;}
  #print{display:none;}
  @media print{
    body{background:#fff;color:#000;padding:0;}
    .wrap,.toast,dialog,.fab{display:none!important;}
    #print{display:block;font-family:Georgia,serif;font-size:12pt;color:#000;max-width:none;padding:0;}
    #print h1{font-size:22pt;margin:0 0 4pt;}
    #print h2{font-size:14pt;margin:16pt 0 6pt;border-bottom:1px solid #000;padding-bottom:2pt;}
    #print .pday{margin:0 0 8pt;page-break-inside:avoid;}
    #print .pday h3{font-size:12pt;margin:0 0 2pt;}
    #print .pit{margin:0 0 3pt 14pt;}

    else if (k === 'html') n.innerHTML = attrs[k];
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]);

function coordsFromLink(s){
  if (!s) return null;
  let m = s.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/) || s.match(/[?&]q=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/) || s.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/) || s.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);

  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  try {
    if (standalone) await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
    else await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  }
  catch(e){
    const code = e && e.code || '';
    if (code === 'auth/popup-blocked'){ try { await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); return; } catch(e2){} }
    if (code === 'auth/unauthorized-domain') toast('Lénið vantar í Authorized domains í Firebase.');
    else if (code === 'auth/operation-not-allowed') toast('Google-innskráning er ekki virkjuð í Firebase.');
    else if (code !== 'auth/popup-closed-by-user' && code !== 'auth/cancelled-popup-request') toast('Innskráning tókst ekki: ' + code);
  }
}

/* ------------------------------------------------------------------
   Leið: #  |  #t/{tripId}  |  #t/{tripId}/{tab}
------------------------------------------------------------------ */
function route(){
  const m = location.hash.replace(/^#\/?/, '').match(/^t\/([a-z0-9]+)(?:\/([a-z]+))?(?:\/([a-z0-9]+))?/i);
  if (!m) return { view:'home' };
  const tab = m[2] || null;
  return { view:'trip', id: m[1].toLowerCase(), tab: tab === 'join' ? null : tab, key: tab === 'join' ? (m[3] || null) : null };
}

}

/* Eyðublað fyrir nýja ferð, eða stillingar ferðar sem er til */
function tripForm(trip){

  const f = el('form', {class:'form', onsubmit: e => { e.preventDefault(); saveTrip(); }});

  const start = el('input', {id:'tStart', type:'date', required:'', value: trip ? trip.start : ''});
  const end = el('input', {id:'tEnd', type:'date', required:'', value: trip ? trip.end : '', min: trip ? trip.start : null});

  const og2 = el('optgroup', {label:'Öll'}); for (const z of allTz) og2.append(el('option', {value:z, selected: curTz === z ? '' : null}, z.replace(/_/g,' ')));

  f.append(
    el('label', {class:'full'}, 'Heiti ferðar', title),
    el('label', {}, 'Fyrsti dagur', start),
    el('label', {}, 'Síðasti dagur', end),
    el('label', {class:'full'}, 'Um ferðina', desc),
    el('label', {class:'full'}, 'Tímabelti áfangastaðar (sýnir klukku þar og heima í haus)', tzSel),
    el('div', {class:'full', style:'font-size:13px;color:var(--dim)'}, 'Útlit'),
    themes
  );
  const st = el('p', {class:'status'});

  if (!isNew) row.append(el('button', {class:'btn danger', type:'button', onclick: deleteTrip}, 'Eyða ferð'));
  f.append(row, st);
  card.append(f);

  async function saveTrip(){
    st.className = 'status';
    const t = title.value.trim(), s = start.value, e = end.value;
    if (!t || !s || !e){ st.textContent = 'Heiti og báðar dagsetningar þarf.'; st.classList.add('err'); return; }
    if (e < s){ st.textContent = 'Síðasti dagur er á undan þeim fyrsta.'; st.classList.add('err'); return; }
    st.textContent = 'Vistar…';

      if (isNew){

        await db.ref().update({
          [`travel/trips/${cur.id}/title`]: t, [`travel/trips/${cur.id}/start`]: s, [`travel/trips/${cur.id}/end`]: e,
          [`travel/trips/${cur.id}/description`]: desc.value.trim(), [`travel/trips/${cur.id}/theme`]: theme, [`travel/trips/${cur.id}/tz`]: tzSel.value || null,

  }
  async function deleteTrip(){
    if (!confirm(`Eyða ferðinni "${cur.trip.title}" með öllum færslum? Þetta er endanlegt.`)) return;
    try {
      await db.ref().update({ [`travel/trips/${cur.id}`]: null, [`travel/private/${cur.id}`]: null, [`travel/team/${cur.id}`]: null, [`travel/editkeys/${cur.id}`]: null, [`travel/claims/${cur.id}`]: null, [`travel/users/${user.uid}/trips/${cur.id}`]: null });
      toast('Ferð eytt'); location.hash = '';
    } catch(err){ toast('Tókst ekki að eyða: ' + (err.code || '')); }
  }
  return card;
}

/* ==================================================================
   FERÐ
   ================================================================== */
let cur = null;       /* { id, trip, items:[], suggestions:{}, ref, tab } */
let map = null, markers = [], infoWin = null;

function stopTrip(){
  if (cur && cur.ref) cur.ref.off();
  if (cur && cur.privRef) cur.privRef.off();
  if (cur && cur.teamRef) cur.teamRef.off();
  if (myTripsRef){ myTripsRef.off(); myTripsRef = null; }
  cur = null; map = null; markers = []; exploreLast = null;
}
function isOwner(){ return !!(user && cur && cur.trip && cur.trip.owner === user.uid); }
/* Ritstjóri: innskráður notandi sem þáði ritstjórahlekk. Má breyta áætluninni, sér ekki einkahólfið. */
function isEditor(){ return !!(user && cur && cur.trip && cur.trip.editors && cur.trip.editors[user.uid]); }
function canEdit(){ return isOwner() || isEditor(); }
function myName(){ return user ? (user.displayName || user.email || 'notandi') : (store.get('travel:name', '') || 'gestur'); }
const personName = pid => { const p = cur && cur.people ? cur.people.find(x => x.id === pid) : null; return p ? p.name : null; };
const namesOf = ids => (ids || []).map(personName).filter(Boolean).join(', ');
/* Breytingasaga: hver gerði hvað, hvenær. Sýnd eiganda og ritstjórum. */
function logChange(what){
  if (!cur || !cur.id) return;
  db.ref(`travel/trips/${cur.id}/log`).push({ at: new Date().toISOString(), by: myName(), what: String(what).slice(0, 160) }).catch(() => {});
}

/* Síðasta útgáfa ferðar er geymd í símanum svo hún opnist án nets */
function cacheTrip(){
  if (!cur || !cur.trip) return;
  store.set(`travel:cache:${cur.id}`, { trip: cur.trip, priv: isOwner() ? cur.priv : {}, team: canEdit() ? cur.team : {}, uid: canEdit() ? user.uid : null, savedAt: new Date().toISOString() });
}
const withPriv = (id, it) => { const p = cur.priv[id] || {}; return { id, ...it, conf: p.conf || it.conf || null, price: p.price || it.price || null, paidBy: p.paidBy || null, split: p.split || null }; };
function applyTripData(v){
  cur.trip = v;
  cur.items = Object.entries(v.items || {}).map(([id, it]) => withPriv(id, it)).sort((a,b) => (a.start || '').localeCompare(b.start || ''));
  cur.suggestions = v.suggestions || {};
  cur.ideas = Object.entries(v.ideas || {}).map(([id, x]) => ({ id, ...x })).sort((a,b) => (a.created || '').localeCompare(b.created || ''));
  cur.people = Object.entries(v.people || {}).map(([id, x]) => ({ id, ...x })).sort((a,b) => (a.created || '').localeCompare(b.created || ''));
  cur.log = Object.entries(v.log || {}).map(([id, x]) => ({ id, ...x })).sort((a,b) => (b.at || '').localeCompare(a.at || ''));
  applyTeamData(cur.team || {});
}
/* Hópshólf (travel/team): pökkun og verkefni. Aðeins eigandi og ritstjórar lesa og skrifa. */
function applyTeamData(t){
  cur.team = t || {};
  cur.packing = Object.entries(cur.team.packing || {}).map(([id, x]) => ({ id, ...x })).sort((a,b) => (a.created || '').localeCompare(b.created || ''));
  cur.todos = Object.entries(cur.team.todos || {}).map(([id, x]) => ({ id, ...x }));
  cur.marks = Object.entries(cur.team.marks || {}).map(([id, x]) => ({ ...x, placeId: id })).sort((a,b) => (b.at || '').localeCompare(a.at || ''));
}
function watchTeam(){
  if (!cur) return;
  if (!canEdit()){ if (cur.teamRef){ cur.teamRef.off(); cur.teamRef = null; } if (cur.teamOk !== undefined){ cur.teamOk = undefined; applyTeamData({}); } return; }
  if (cur.teamRef) return;
  cur.teamRef = db.ref(`travel/team/${cur.id}`);
  cur.teamRef.on('value', snap => {
    if (!cur) return;
    cur.teamOk = true; applyTeamData(snap.val() || {});
    if (isOwner()) migratePacking();
    cacheTrip(); renderTrip();
  }, err => { cur.teamOk = false; cur.teamErr = err && (err.code || err.message) || 'óþekkt villa'; renderTrip(); });
}
/* Eldri pökkunarlistar lágu í opna hlutanum. Eigandi flytur þá í hópshólfið, einu sinni. */
let migratingPack = false;
async function migratePacking(force){
  if (migratingPack || !isOwner() || !cur.trip || !cur.trip.packing) return;
  if (!force && (cur.teamOk !== true || cur.packErr)) return;
  migratingPack = true; cur.packErr = null;
  const upd = {};
  for (const [id, x] of Object.entries(cur.trip.packing)) if (x && !(cur.team.packing && cur.team.packing[id])) upd[`travel/team/${cur.id}/packing/${id}`] = x;
  upd[`travel/trips/${cur.id}/packing`] = null;
  try { await db.ref().update(upd); toast('Pökkunarlistinn fluttur í hólf fyrir eiganda og ritstjóra'); }
  catch(e){ cur.packErr = (e && (e.code || e.message)) || 'óþekkt villa'; toast('Náði ekki að flytja pökkunarlistann: ' + cur.packErr); renderTrip(); }
  finally { migratingPack = false; }
}
function openTrip(r){
  if (cur && cur.id === r.id){ cur.tab = r.tab || cur.tab; if (r.key) cur.join = r.key; renderTrip(); return; }
  stopTrip();
  store.set('travel:last', r.id);
  cur = { id: r.id, trip: null, items: [], suggestions: {}, ideas: [], packing: [], todos: [], marks: [], people: [], log: [], team: {}, teamRef: null, priv: {}, privRef: null, ref: db.ref(`travel/trips/${r.id}`), tab: r.tab || store.get('travel:tab', 'dagar'), join: r.key || null, fromCache: false, live: false };
  $('#app').innerHTML = '<p class="empty">Sæki ferðina…</p>';
  setHeader('Sæki…', '');
  const cached = store.get(`travel:cache:${r.id}`, null);
  if (cached && cached.trip){
    /* einkagögn úr geymslu aðeins ef sami notandi er innskráður */
    cur.priv = (cached.uid && user && cached.uid === user.uid) ? (cached.priv || {}) : {};
    cur.team = (cached.uid && user && cached.uid === user.uid) ? (cached.team || {}) : {};
    cur.fromCache = true; cur.cachedAt = cached.savedAt;
    applyTripData(cached.trip);
    renderTrip();
  }
  cur.ref.on('value', snap => {
    const v = snap.val();
    if (!v){ renderMissing(); return; }
    cur.fromCache = false; cur.live = true;
    applyTripData(v);
    watchPrivate(); watchTeam();
    if (isOwner() && cur.privOk) migrateConf();
    if (isOwner()) migratePacking();
    cacheTrip();
    renderTrip();
  }, err => {
    $('#app').innerHTML = `<div class="card"><p style="margin:0 0 12px">Náði ekki í ferðina. ${err && err.code === 'PERMISSION_DENIED' ? 'Reglurnar fyrir /travel vantar í Firebase.' : ''}</p><a class="btn" href="/travel/" style="text-decoration:none;display:inline-block">Á forsíðu</a></div>`;
  });
}
/* Bókunarnúmer eru geymd í travel/private/{tid}, sem aðeins eigandi má lesa.
   Eigandi fær þau hér og þau renna saman við færslurnar. Gestir sjá þau aldrei. */
function watchPrivate(){
  if (!cur || cur.privRef || !isOwner()) return;
  cur.privRef = db.ref(`travel/private/${cur.id}`);
  cur.privRef.on('value', snap => {
    if (!cur) return;
    cur.priv = snap.val() || {};
    cur.privOk = true;
    cur.items = cur.items.map(it => withPriv(it.id, it));
    migrateConf();
    cacheTrip();
    renderTrip();
  }, err => {
    cur.privOk = false;
    cur.privErr = err && (err.code || err.message) || 'óþekkt villa';
    renderTrip();
  });
}
/* Eldri færslur með bókunarnúmer í opna hlutanum: færa í einkahólfið, einu sinni */
let migrating = false;
async function migrateConf(){
  if (migrating || !isOwner() || !cur.trip) return;
  const upd = {};
  for (const [id, it] of Object.entries(cur.trip.items || {})){
    if (it && it.conf){ upd[`travel/private/${cur.id}/${id}/conf`] = it.conf; upd[`travel/trips/${cur.id}/items/${id}/conf`] = null; }
    if (it && it.price){ upd[`travel/private/${cur.id}/${id}/price`] = it.price; upd[`travel/trips/${cur.id}/items/${id}/price`] = null; }
  }
  if (!Object.keys(upd).length) return;
  migrating = true;
  try { await db.ref().update(upd); toast('Bókunarnúmer og verð færð í einkahólf'); }
  catch(e){ toast('Náði ekki að færa bókunarnúmer í einkahólf: ' + (e.code || e.message)); }
  finally { migrating = false; }
}
function renderMissing(){
  stopTrip(); $('#tabrow').hidden = true;
  setHeader('Úps', '');
  $('#app').innerHTML = `<div class="card"><p style="margin:0 0 12px">Þessi ferð finnst ekki. Kannski var henni eytt, eða hlekkurinn er rangur.</p><a class="btn" href="/travel/" style="text-decoration:none;display:inline-block">Á forsíðu</a></div>`;
}

function renderTrip(){
  const { trip } = cur; if (!trip) return;
  applyTheme(trip.theme);
  const nights = Math.max(0, Math.round((parse(trip.end) - parse(trip.start)) / 86400000));
  const hotels = cur.items.filter(i => i.kind === 'hotel').length;
  const nPeople = (cur.people || []).length;
  setHeader(trip.title, `${fmtRange(trip.start, trip.end)} · ${nights} ${nights === 1 ? 'nótt' : 'nætur'}${hotels ? ` · ${hotels} ${hotels === 1 ? 'gisting' : 'gistingar'}` : ''}${nPeople ? ` · ${nPeople} manns` : ''}`, isOwner() ? 'þín ferð' : isEditor() ? 'ritstjóri' : 'gestur');
  /* Niðurtalning eða staða ferðar í haus */
  const today = todayIso();
  const daysTo = Math.round((parse(trip.start) - parse(today)) / 86400000);
  const dayNo = Math.round((parse(today) - parse(trip.start)) / 86400000) + 1;
  const total = Math.round((parse(trip.end) - parse(trip.start)) / 86400000) + 1;
  let cd = '';
  if (daysTo > 0) cd = daysTo === 1 ? 'Á morgun' : `Eftir ${daysTo} daga`;
  else if (today <= trip.end) cd = `Dagur ${dayNo} af ${total}`;
  else cd = 'Lokið';
  $('#title').append(el('span', {class:'countdown'}, cd));
  renderUserbar();
  renderClock();

  const owner = isOwner(), editor = canEdit();
  const nSug = Object.keys(cur.suggestions).length;
  const nIdeas = cur.ideas.filter(i => !i.scheduled).length;
  if (cur.tab === 'dagatal'){ cur.tab = 'dagar'; store.set('travel:dagview', 'cal'); }
  const nPack = cur.packing.length, nPackDone = cur.packing.filter(x => x.done).length;
  const todayStr = todayIso();
  const nTodo = cur.todos.filter(x => !x.done).length, nOver = cur.todos.filter(x => !x.done && x.due && x.due < todayStr).length;
  const tabs = [['dagar','Dagskrá'],['kort','Kort'],['gisting','Gisting'],['hugmyndir','Hugmyndabanki' + (nIdeas ? `<span class="cnt">${nIdeas}</span>` : '')]];
  if (editor) tabs.push(['verkefni','Verkefni' + (nOver ? `<span class="n" title="${nOver} komið fram yfir">${nOver}</span>` : nTodo ? `<span class="cnt">${nTodo}</span>` : '')]);
  if (editor) tabs.push(['pokkun','Pökkun' + (nPack ? `<span class="cnt">${nPackDone}/${nPack}</span>` : '')]);
  if (owner) tabs.push(['mikilvaegt', 'Mikilvægt']);
  if (owner) tabs.push(['stillingar', 'Stillingar' + (nSug ? `<span class="n">${nSug}</span>` : '')]);
  if (!tabs.some(t => t[0] === cur.tab)) cur.tab = 'dagar';
  $('#tabrow').hidden = false;
  const nav = $('#tabs'); nav.innerHTML = '';
  for (const [k, label] of tabs){
    nav.append(el('button', {role:'tab', 'aria-selected': String(cur.tab === k), html: label, onclick: () => { cur.tab = k; store.set('travel:tab', k); history.replaceState(null, '', `#t/${cur.id}/${k}`); renderTrip(); }}));
  }
  /* Á síma: fölva hægri brún meðan fleiri flipar eru utan skjás, og skruna valinn flipa í sýn */
  const paintMore = () => nav.classList.toggle('more', nav.scrollLeft + nav.clientWidth < nav.scrollWidth - 2);
  if (!nav.dataset.scrollHooked){ nav.addEventListener('scroll', paintMore, { passive:true }); window.addEventListener('resize', paintMore); nav.dataset.scrollHooked = '1'; }
  const sel = nav.querySelector('[aria-selected="true"]');

  else if (cur.tab === 'verkefni') renderTodos(app);

  $('#foot').innerHTML = `${footText}<span class="footlinks">${footLinks}</span>`;
  $('#printBtn').onclick = printTrip;
  const cs = $('#copyShare'); if (cs) cs.onclick = () => copy(`${BASE}#t/${cur.id}`, 'Hlekkur afritaður');

/* ---------- ritstjórahlekkur: #t/{id}/join/{lykill} ---------- */
function renderJoin(host){
  if (!user){
    const card = el('div', {class:'card'}, el('h2', {}, 'Þér var boðið að verða ritstjóri'),
      el('p', {class:'help', style:'margin:0 0 12px'}, 'Ritstjóri breytir áætluninni, verkefnum og pökkun. Skráðu þig inn með Google til að þiggja boðið.'),
      el('button', {class:'gbtn', type:'button', onclick: signIn}, el('span', {class:'glogo'}), 'Halda áfram með Google'));
    host.append(card); return;
  }

  history.replaceState(null, '', `#t/${cur.id}`);
  if (isOwner()){ toast('Þú ert eigandi ferðarinnar.'); return; }
  if (isEditor()){ toast('Þú ert þegar ritstjóri.'); return; }

}
async function claimEditor(key){
  try {
    await db.ref(`travel/claims/${cur.id}/${user.uid}`).set(key);
    await db.ref(`travel/trips/${cur.id}/editors/${user.uid}`).set({ name: user.displayName || user.email || 'ritstjóri', since: new Date().toISOString() });
    toast('Þú ert nú ritstjóri ferðarinnar.');

  } catch(e){

    toast(c === 'PERMISSION_DENIED' ? 'Hlekkurinn er útrunninn, eða reglurnar fyrir ritstjóra vantar í Firebase.' : 'Tókst ekki: ' + (c || e.message));
  }
}

/* ---------- veðurspá á dagana: Open-Meteo, 16 daga, staðsetning gistingar dagsins ---------- */
const WMO = {
  0:['Heiðskírt','☀️'],1:['Léttskýjað','🌤️'],2:['Skýjað með köflum','⛅'],3:['Alskýjað','☁️'],
  45:['Þoka','🌫️'],48:['Þoka','🌫️'],
  51:['Súld','🌦️'],53:['Súld','🌦️'],55:['Súld','🌦️'],56:['Frostúði','🌧️'],57:['Frostúði','🌧️'],
  61:['Rigning','🌧️'],63:['Rigning','🌧️'],65:['Mikil rigning','🌧️'],66:['Frostrigning','🌧️'],67:['Frostrigning','🌧️'],
  71:['Snjókoma','🌨️'],73:['Snjókoma','🌨️'],75:['Mikil snjókoma','❄️'],77:['Slydda','🌨️'],
  80:['Skúrir','🌦️'],81:['Skúrir','🌦️'],82:['Slagveður','⛈️'],85:['Snjóél','🌨️'],86:['Snjóél','🌨️'],
  95:['Þrumuveður','⛈️'],96:['Þrumuveður','⛈️'],99:['Þrumuveður með hagléli','⛈️']
};
const hasLoc = x => x && x.lat != null && x.lng != null;
const locKey = x => `${(+x.lat).toFixed(2)},${(+x.lng).toFixed(2)}`;
/* Staðsetning dagsins: gisting, annars fyrsta færsla dagsins með hnit, annars fyrsta gisting ferðarinnar */
function dayLoc(day){
  const stay = stayOn(day); if (hasLoc(stay)) return stay;
  const it = cur.items.find(i => i.kind !== 'hotel' && dpart(i.start) === day && hasLoc(i)); if (it) return it;
  const h = cur.items.find(i => i.kind === 'hotel' && hasLoc(i)); return h || null;
}
async function fetchWx(key){
  const cache = store.get('travel:wx', {});
  if (cache[key] && Date.now() - cache[key].at < 3 * 3600 * 1000) return cache[key].days;
  const [lat, lng] = key.split(',');
  const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16`);
  if (!r.ok) throw new Error('wx');
  const j = await r.json(); const d = j.daily || {}; const days = {};
  (d.time || []).forEach((t, i) => { days[t] = { code: d.weather_code[i], tmax: Math.round(d.temperature_2m_max[i]), tmin: Math.round(d.temperature_2m_min[i]), pp: d.precipitation_probability_max ? d.precipitation_probability_max[i] : null }; });
  const keep = {}; for (const k in cache) if (Date.now() - cache[k].at < 24 * 3600 * 1000) keep[k] = cache[k];
  keep[key] = { at: Date.now(), days }; store.set('travel:wx', keep);
  return days;
}
/* Fyllir inn í .wx reiti sem renderDays setti; einn sóttur spá á hvern stað */
function paintWx(root){
  const spans = [...root.querySelectorAll('.wx[data-key]')]; if (!spans.length) return;
  const keys = [...new Set(spans.map(x => x.dataset.key))];
  for (const key of keys){
    fetchWx(key).then(days => {
      for (const sp of spans){
        if (sp.dataset.key !== key) continue;
        const w = days[sp.dataset.day]; if (!w) continue;
        const [desc, emoji] = WMO[w.code] || ['', '🌡️'];
        sp.innerHTML = `${emoji} <b>${w.tmax}°</b>/${w.tmin}°`;
        sp.title = `${desc}. Hæst ${w.tmax}°, lægst ${w.tmin}°${w.pp != null ? `, úrkomulíkur ${w.pp}%` : ''}. Spá Open-Meteo.`;
      }
    }).catch(() => {});
  }
}

/* ---------- ferðatími milli staða sama dags: Google Routes API (computeRouteMatrix) ---------- */
let legsDenied = false;
function legKey(o, d){ return `${(+o.lat).toFixed(4)},${(+o.lng).toFixed(4)}|${(+d.lat).toFixed(4)},${(+d.lng).toFixed(4)}`; }
function fmtLeg(secs, meters){
  const m = Math.round(secs / 60); const t = m >= 60 ? `${Math.floor(m / 60)} klst ${m % 60} mín` : `${m} mín`;
  const km = meters >= 10000 ? Math.round(meters / 1000) + ' km' : (meters / 1000).toFixed(1).replace('.', ',') + ' km';
  return `🚗 ${t} · ${km}`;
}
async function fetchLeg(key){
  const [o, d] = key.split('|').map(x => x.split(',').map(Number));
  const wp = ([lat, lng]) => ({ waypoint: { location: { latLng: { latitude: lat, longitude: lng } } } });
  const r = await fetch('https://routes.googleapis.com/distanceMatrix/v2:computeRouteMatrix', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': MAPS_KEY, 'X-Goog-FieldMask': 'originIndex,destinationIndex,duration,distanceMeters,condition' },
    body: JSON.stringify({ origins: [wp(o)], destinations: [wp(d)], travelMode: 'DRIVE' })
  });
  if (r.status === 403 || r.status === 401){ legsDenied = true; console.warn('Routes API: aðgangi hafnað. Virkja Routes API fyrir Google lykilinn.'); return null; }
  if (!r.ok) return null;
  const j = await r.json(); const e = Array.isArray(j) ? j[0] : null;
  if (!e || e.condition !== 'ROUTE_EXISTS' || !e.duration) return null;
  return { secs: parseInt(e.duration, 10), meters: e.distanceMeters || 0 };
}
function paintLegs(root){
  const legs = [...root.querySelectorAll('.leg[data-o]')]; if (!legs.length || !MAPS_READY || legsDenied) return;
  const cache = store.get('travel:legs', {});
  const todo = [];
  for (const lg of legs){
    const c = cache[lg.dataset.key];
    if (c && Date.now() - c.at < 7 * 24 * 3600 * 1000){ if (c.secs != null) lg.textContent = fmtLeg(c.secs, c.meters); }
    else todo.push(lg);
  }
  const keys = [...new Set(todo.map(l => l.dataset.key))].slice(0, 30);
  for (const key of keys){
    fetchLeg(key).then(res => {
      const c = store.get('travel:legs', {});
      c[key] = res ? { at: Date.now(), secs: res.secs, meters: res.meters } : { at: Date.now(), secs: null };
      store.set('travel:legs', c);
      if (res) for (const lg of todo) if (lg.dataset.key === key) lg.textContent = fmtLeg(res.secs, res.meters);
    }).catch(() => {});
  }
}

/* ---------- dagur fyrir dag ---------- */
function allDays(){
  const out = []; const d = parse(cur.trip.start), end = parse(cur.trip.end);
  let guard = 0;
  while (d <= end && guard++ < 400){ out.push(iso(d)); d.setDate(d.getDate()+1); }
  return out;
}
const stayOn = day => cur.items.find(i => i.kind === 'hotel' && dpart(i.start) <= day && dpart(i.end) > day);

function renderDays(host){
  const days = allDays();
  const grid = el('div', {class:'days'});
  const today = todayIso();
  const stays = cur.items.filter(i => i.kind === 'hotel');
  const outside = cur.items.filter(i => i.kind !== 'hotel' && (dpart(i.start) < cur.trip.start || dpart(i.start) > cur.trip.end));
  if (!cur.items.length) host.append(el('p', {class:'empty'}, canEdit() ? 'Engin færsla enn. Smelltu á "Bæta við" til að skrá fyrsta flugið eða hótelið.' : 'Engin færsla enn.'));
  const placed = new Set();
  const wxLimit = iso(new Date(Date.now() + 15 * 86400000));
  if (cur.trip.start > wxLimit && cur.items.some(hasLoc)){ const dd = Math.round((parse(cur.trip.start) - parse(today)) / 86400000); host.append(el('p', {class:'help', style:'margin:0 0 8px'}, `Veðurspá birtist við dagana þegar 16 dagar eða færri eru í þá. Nú eru ${dd} dagar í ferðina.`)); }
  days.forEach((day, idx) => {
    const row = idx + 1;
    const d = parse(day);
    const dateCell = el('div', {class:'date' + (dow(d) > 4 ? ' we' : '') + (day === today ? ' today' : ''), id: day === today ? 'day-today' : null, style:`grid-row:${row}`, html:`<b>${d.getDate()}</b><span>${day === today ? 'í dag' : DOW[dow(d)] + ' ' + MONTH_S[d.getMonth()]}</span>`});
    /* veðurspá: aðeins dagar sem spáin nær til */
    if (day >= today && day <= wxLimit){ const loc = dayLoc(day); if (loc) dateCell.append(el('span', {class:'wx', 'data-key': locKey(loc), 'data-day': day})); }
    grid.append(dateCell);
    const todays = cur.items.filter(i => i.kind !== 'hotel' && dpart(i.start) === day).sort((a,b) => a.start.localeCompare(b.start));
    const items = el('div', {class:'items', style:`grid-row:${row}`});
    if (!todays.length) items.append(el('p', {class:'empty'}, 'Frjáls dagur.'));
    const nowStr = day === today ? `${day}T${pad(new Date().getHours())}:${pad(new Date().getMinutes())}` : null;
    let nextMarked = false;
    let prev = stayOn(day);   /* ferðatími: frá gistingu í fyrstu færslu, svo milli færslna */
    for (const it of todays){
      if (hasLoc(prev) && hasLoc(it) && legKey(prev, it).split('|')[0] !== legKey(prev, it).split('|')[1]) items.append(el('div', {class:'leg', 'data-o': '1', 'data-key': legKey(prev, it)}));
      const card = itemCard(it);
      if (nowStr && !nextMarked && (it.end || it.start) >= nowStr){ card.classList.add('next'); nextMarked = true; }
      items.append(card);
      if (hasLoc(it)) prev = it;
    }
    grid.append(items);
    /* Gisting sem rönd í þriðja dálki yfir næturnar */
    for (const h of stays){
      if (placed.has(h.id)) continue;
      const hs = dpart(h.start), he = dpart(h.end || h.start);
      if (hs === day || (hs < day && he > day)){
        let n = 0; while (idx + n < days.length && days[idx + n] < he) n++;
        if (n === 0) n = 1;
        placed.add(h.id);
        grid.append(stayCell(h, row, n));
      }
    }
  });
  const unplaced = stays.filter(h => !placed.has(h.id));
  host.append(grid);
  paintWx(grid); paintLegs(grid);
  if (outside.length || unplaced.length){
    const wrap = el('div', {class:'card', style:'margin-top:16px'}, el('h2', {style:'font-size:17px'}, 'Utan ferðatímabils'));
    const items = el('div', {class:'items'});
    for (const it of outside.concat(unplaced)) items.append(itemCard(it));
    wrap.append(items); host.append(wrap);
  }
}
function stayCell(h, row, n){
  const link = gmapsLink(h);
  const c = el('div', {class:'stay', style:`grid-row:${row} / span ${n}`, title: h.title});
  const full = el('div', {class:'full'});
  full.append(el('span', {class:'kind'}, 'Gisting'), el('b', {class:'name'}, h.title),
    el('span', {class:'d'}, `${n} ${n === 1 ? 'nótt' : 'nætur'}`),
    el('span', {class:'d'}, `Inn ${fmtD(h.start)}${tpart(h.start) ? ' kl. ' + tpart(h.start) : ''}`),
    el('span', {class:'d'}, h.end ? `Út ${fmtD(h.end)}${tpart(h.end) ? ' kl. ' + tpart(h.end) : ''}` : ''));
  if (h.place) full.append(el('span', {class:'d'}, h.place));
  if (h.conf) full.append(el('span', {class:'conf', style:'align-self:flex-start'}, h.conf));
  if (h.note) full.append(el('span', {class:'d', style:'white-space:pre-line'}, h.note));
  const acts = el('div', {class:'acts'});
  if (link) acts.append(el('a', {class:'maplink', href:link, target:'_blank', rel:'noopener'}, 'Opna í Google Maps ↗'));
  if (h.url) acts.append(el('a', {class:'maplink', href:h.url, target:'_blank', rel:'noopener'}, 'Bókun ↗'));
  if (canEdit()) acts.append(el('button', {class:'linkbtn', type:'button', onclick: () => openItemDialog(h)}, 'Breyta'));
  full.append(acts);
  c.append(full, el('span', {class:'short'}, h.title));
  c.addEventListener('click', e => {
    if (e.target.closest('a,button')) return;
    if (window.matchMedia('(max-width:640px)').matches){ cur.tab = 'gisting'; store.set('travel:tab','gisting'); renderTrip(); }
  });
  return c;
}
/* Opnunartími dagsins sem færslan er á. Google skilar lista frá mánudegi, eins og dow(). */
function openingText(it){
  if (!it.hours || !it.hours.length || !it.start || it.kind === 'hotel' || it.kind === 'flight') return '';
  const line = it.hours[dow(parse(it.start))] || ''; const i = line.indexOf(': ');
  const t = (i >= 0 ? line.slice(i + 2) : line).replace(/\u2009|\u202f/g, ' ').trim();
  if (!t) return '';
  return /lokað|closed/i.test(t) ? 'Lokað þennan dag' : 'Opið ' + t;
}
function itemCard(it, asNight){
  const k = kindOf(it.kind);
  const card = el('div', {class:'item' + (asNight ? ' night' : ''), style:`--c:${k.c}`});
  let time;
  if (asNight) time = `<span class="time">Gisting<small>nótt</small></span>`;
  else if (it.kind === 'hotel') time = `<span class="time">${esc(tpart(it.start)) || ''}<small>innritun</small></span>`;
  else {
    const sameDay = dpart(it.end) === dpart(it.start) || !it.end;
    time = `<span class="time">${esc(tpart(it.start))}<small>${it.end ? 'til ' + (sameDay ? '' : parse(it.end).getDate() + '. ' + MONTH_S[parse(it.end).getMonth()] + ' ') + esc(tpart(it.end)) : ''}</small></span>`;
  }
  const whoTxt = it.who && it.who.length ? namesOf(it.who) : '';
  const rating = it.rating ? `★ ${String(it.rating).replace('.', ',')}${it.ratingCount ? ` (${Number(it.ratingCount).toLocaleString('de-DE')})` : ''}` : '';
  const hoursTxt = openingText(it);
  const meta = [it.flightNo ? `<span class="conf">${esc(it.flightNo)}</span>` : '', it.place ? esc(it.place) : '', rating, hoursTxt ? `<span class="${/lokað|closed/i.test(hoursTxt) ? 'closed' : 'open'}">${esc(hoursTxt)}</span>` : '', whoTxt ? `👤 ${esc(whoTxt)}` : '', it.conf ? `<span class="conf">${esc(it.conf)}</span>` : '', it.price ? esc(it.price) : ''].filter(Boolean).map(s => `<span>${s}</span>`).join('');
  const link = gmapsLink(it);
  if (it.flightNo) card.dataset.flight = it.flightNo;
  if (asNight){
    card.innerHTML = `<i class="bar"></i><div class="main"><div class="kind">Gisting</div><div class="title" style="font-weight:500">${esc(it.title)}</div></div>${time}`;
    return card;
  }
  card.innerHTML = `<i class="bar"></i><div class="main"><div class="kind">${k.label}</div><div class="title">${esc(it.title)}</div>${meta ? `<div class="meta">${meta}</div>` : ''}${it.note ? `<div class="meta" style="margin-top:4px;white-space:pre-line">${esc(it.note)}</div>` : ''}<div class="acts"></div></div>${time}`;
  const acts = card.querySelector('.acts');
  if (link) acts.append(el('a', {class:'maplink', href:link, target:'_blank', rel:'noopener'}, 'Opna í Google Maps ↗'));
  const dir = dirLink(it);
  if (dir) acts.append(el('a', {class:'maplink', href:dir, target:'_blank', rel:'noopener'}, 'Leið frá hótelinu ↗'));
  if (it.flightNo) acts.append(el('a', {class:'maplink', href:`https://www.flightradar24.com/data/flights/${encodeURIComponent(it.flightNo.replace(/\s+/g,'').toLowerCase())}`, target:'_blank', rel:'noopener'}, 'Staða flugs ↗'));
  if (it.url) acts.append(el('a', {class:'maplink', href:it.url, target:'_blank', rel:'noopener'}, 'Bókun ↗'));
  if (canEdit() && !asNight) acts.append(el('button', {class:'linkbtn', type:'button', onclick: () => openItemDialog(it)}, 'Breyta'));
  return card;
}

function renderCal(host){
  const months = el('div', {class:'months'});
  const s = parse(cur.trip.start), e = parse(cur.trip.end);
  const list = []; let y = s.getFullYear(), m = s.getMonth();
  while (y < e.getFullYear() || (y === e.getFullYear() && m <= e.getMonth())){ list.push([y,m]); m++; if (m > 11){ m = 0; y++; } if (list.length > 24) break; }
  for (const [yy,mm] of list){
    const sec = el('div');
    sec.innerHTML = `<div class="cal-head"><h3>${MONTH[mm][0].toUpperCase()+MONTH[mm].slice(1)} ${yy}</h3></div><div class="dow">${DOW.map(d => `<span>${d}</span>`).join('')}</div><div class="cal"></div>`;
    const cal = sec.querySelector('.cal');
    for (let i = 0; i < dow(new Date(yy,mm,1)); i++) cal.append(el('div', {class:'c pad'}));
    const days = new Date(yy,mm+1,0).getDate();
    for (let d = 1; d <= days; d++){
      const key = iso(new Date(yy,mm,d));
      const inTrip = key >= cur.trip.start && key <= cur.trip.end;
      const c = el('div', {class:'c' + (inTrip ? '' : ' out'), onclick: () => { if (!inTrip) return; store.set('travel:dagview', 'list'); cur.tab = 'dagar'; renderTrip(); } });
      let html = `<div class="n${dow(new Date(yy,mm,d)) > 4 ? ' we' : ''}">${d}</div>`;
      const stay = stayOn(key);
      if (stay){
        const start = dpart(stay.start) === key;
        const end = iso(new Date(parse(stay.end).getTime() - 86400000)) === key;
        html += `<div class="stay${start ? ' start' : ''}${end ? ' end' : ''}" title="${esc(stay.title)}"></div>`;
      }
      for (const it of cur.items.filter(i => dpart(i.start) === key && i.kind !== 'hotel')){
        html += `<div class="ev" style="--c:${kindOf(it.kind).c}" title="${esc(it.title)}"><i></i><span>${esc(it.title)}</span></div>`;
      }
      c.innerHTML = html; cal.append(c);
    }
    months.append(sec);
  }
  host.append(months);
  host.append(el('div', {class:'legend', html:`<span style="--c:var(--hotel)">Gisting (rönd)</span><span style="--c:var(--flight)">Flug</span><span style="--c:var(--move)">Ferð milli staða</span><span style="--c:var(--act)">Afþreying</span><span style="--c:var(--note)">Minnispunktur</span>`}));
}

let mapsLoading = null;
function loadMaps(){
  if (window.google && google.maps) return Promise.resolve();
  if (mapsLoading) return mapsLoading;
  mapsLoading = new Promise((res, rej) => {
    window.__mapsReady = () => res();
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(MAPS_KEY)}&libraries=places,marker&language=is&region=IS&loading=async&callback=__mapsReady`;
    s.onerror = () => rej(new Error('maps'));
    document.head.append(s);
  });
  return mapsLoading;
}
const pinned = () => cur.items.filter(i => i.lat != null && i.lng != null);
function renderMap(host){
  if (!MAPS_READY){

  } else {
    host.append(el('div', {id:'gmap'}));
  }

  pts.forEach((it, i) => {
    const d = parse(it.start);
    list.append(el('button', {type:'button', class:'pin', id:'pin-'+it.id, style:`--c:${kindOf(it.kind).c}`, html:`<i></i><b>${esc(it.title)}</b><small>${d.getDate()}. ${MONTH_S[d.getMonth()]}</small>`, onclick: () => focusPin(it.id)}));
  });

  loadMaps().then(() => {
    const elMap = $('#gmap'); if (!elMap) return;
    map = new google.maps.Map(elMap, { center: { lat: 64.1, lng: -21.9 }, zoom: 5, mapTypeControl: false, streetViewControl: false, fullscreenControl: true });
    infoWin = new google.maps.InfoWindow();
    markers = [];
    const bounds = new google.maps.LatLngBounds();
    const colors = { hotel:'#4F5BD5', flight:'#3A4A52', move:'#C98A1B', act:'#E0694B', note:'#7A8C92' };
    for (const it of pts){
      const pos = { lat: +it.lat, lng: +it.lng };
      const mk = new google.maps.Marker({ position: pos, map, title: it.title,
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 9, fillColor: colors[it.kind] || colors.note, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 } });

    else if (pts.length > 1) map.fitBounds(bounds, 40);
  }).catch(() => toast('Google Maps hlaðst ekki. Athugaðu lykilinn.'));

function focusPin(id){
  document.querySelectorAll('.pin').forEach(p => p.classList.toggle('on', p.id === 'pin-' + id));
  const m = markers.find(x => x.id === id);
  if (m && map){
    map.panTo(m.mk.getPosition()); if (map.getZoom() < 12) map.setZoom(13);

    infoWin.setContent(`<div style="font-family:Karla,sans-serif;max-width:220px"><b>${esc(it.title)}</b><br><span style="color:#666">${fmtD(it.start)}${tpart(it.start) ? ' kl. ' + esc(tpart(it.start)) : ''}</span>${it.place ? `<br>${esc(it.place)}` : ''}${link ? `<br><a href="${link}" target="_blank" rel="noopener">Opna í Google Maps</a>` : ''}</div>`);
    infoWin.open({ map, anchor: m.mk });
  } else {
    const it = cur.items.find(i => i.id === id); if (it) toast(`${it.title}${it.place ? ' · ' + it.place : ''}`);
  }
}

/* ---------- hugmyndabanki ---------- */
/* ---------- Skoða í nágrenninu: Google Text Search, aðeins eigandi og ritstjórar, hámark á dag ---------- */
const EXPLORE_MAX = 30;
let exploreLast = null;   /* síðasta leit, svo niðurstöður lifi endurteikningu */
/* leitarorðin eru á ensku: Google finnur þá rétta staði hvar sem er í heiminum, íslensk orð eins og "strendur" skila íslenskum örnefnum */
const EXPLORE_CHIPS = [['Það helsta', 'top tourist attractions'], ['Veitingastaðir', 'best restaurants'], ['Kaffihús', 'cafes'], ['Strendur', 'beaches'], ['Söfn og sýningar', 'museums'], ['Barnvænt', 'things to do with kids']];
const EXPLORE_KMS = [2, 5, 10, 20];
/* radíus leitar, valinn af notanda og geymdur í síma á hverja ferð; 10 km sjálfgefið */
function exploreKm(){ const v = +store.get(`travel:xkm:${cur.id}`, 10); return EXPLORE_KMS.includes(v) ? v : 10; }
function kmBetween(a, b){ const R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180, x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); }
const PRICE = { PRICE_LEVEL_FREE:'ókeypis', PRICE_LEVEL_INEXPENSIVE:'$', PRICE_LEVEL_MODERATE:'$$', PRICE_LEVEL_EXPENSIVE:'$$$', PRICE_LEVEL_VERY_EXPENSIVE:'$$$$' };
/* Allir gististaðir með staðsetningu, í tímaröð. Sjálfgefið gisting dagsins ef ferðin er í gangi, annars sú fyrsta. */
function exploreCenters(){
  const stays = cur.items.filter(i => i.kind === 'hotel' && hasLoc(i));
  if (stays.length) return stays;
  const any = cur.items.find(hasLoc); return any ? [any] : [];
}
function exploreCenter(){
  const list = exploreCenters(); if (!list.length) return null;
  const want = store.get(`travel:xnear:${cur.id}`, null);
  const chosen = want && list.find(h => h.id === want); if (chosen) return chosen;
  const today = todayIso();
  if (cur.trip.start && cur.trip.end && today >= cur.trip.start && today <= cur.trip.end){ const stay = stayOn(today); if (stay && hasLoc(stay)) return stay; }
  return list[0];
}
function exploreCount(){ return (cur.team && cur.team.searches && cur.team.searches[todayIso()]) || 0; }
async function exploreSearch(q, center, km){
  const key = `${q.toLowerCase()}|${locKey(center)}|${km}`;
  const cache = store.get('travel:explore2', {});
  if (cache[key] && Date.now() - cache[key].at < 24 * 3600 * 1000) return { results: cache[key].results, cached: true };
  if (exploreCount() >= EXPLORE_MAX) throw new Error('max');
  await loadMaps();
  const { Place } = await google.maps.importLibrary('places');
  /* locationRestriction heldur leitinni innan kassa í kringum gististaðinn; locationBias var bara tillaga og Google fór út fyrir hana */
  const c = { lat: +center.lat, lng: +center.lng };
  const dLat = km / 111, dLng = km / (111 * Math.max(0.2, Math.cos(c.lat * Math.PI / 180)));
  const { places } = await Place.searchByText({ textQuery: q, fields: ['id','displayName','formattedAddress','location','rating','userRatingCount','priceLevel','primaryTypeDisplayName','photos','regularOpeningHours','websiteURI'], locationRestriction: { north: c.lat + dLat, south: c.lat - dLat, east: c.lng + dLng, west: c.lng - dLng }, maxResultCount: 10, language: 'is' });
  const results = (places || []).filter(p => !p.location || kmBetween(c, { lat: p.location.lat(), lng: p.location.lng() }) <= km * 1.45).map(p => ({
    placeId: p.id, name: p.displayName || '', addr: p.formattedAddress || '', lat: p.location ? p.location.lat() : null, lng: p.location ? p.location.lng() : null,
    rating: p.rating || null, ratingCount: p.userRatingCount || null, price: PRICE[p.priceLevel] || '', type: p.primaryTypeDisplayName || '',
    photo: (p.photos && p.photos[0]) ? p.photos[0].getURI({ maxWidth: 480 }) : null,
    hours: (p.regularOpeningHours && p.regularOpeningHours.weekdayDescriptions) || null, url: p.websiteURI || null
  }));
  const keep = {}; for (const k in cache) if (Date.now() - cache[k].at < 24 * 3600 * 1000) keep[k] = cache[k];
  keep[key] = { at: Date.now(), results }; store.set('travel:explore2', keep);
  return { results, cached: false };
}
function renderExplore(host){
  const box = el('div', {class:'card explore'}, el('h2', {}, 'Tillögur úr nágrenninu'), el('p', {class:'help', style:'margin:0 0 4px'}, 'Frá Google, ekki frá hópnum. Staður fer ekki í hugmyndabankann fyrr en þú velur "Í hugmyndabankann".'));
  const center = exploreCenter();
  if (!MAPS_READY){ box.append(el('p', {class:'help'}, 'Google Maps lykilinn vantar.')); host.append(box); return; }
  if (!center){ box.append(el('p', {class:'help'}, 'Skráðu gistingu með staðsetningu úr Google leitinni, þá leitar þetta í nágrenni hennar.')); host.append(box); return; }
  const status = el('p', {class:'help', style:'margin:0'}, `Niðurstöður með einkunn frá Google. Leitir í dag: ${exploreCount()} af ${EXPLORE_MAX}.`);
  box.append(status);
  /* val um gististað: tillögur fylgja hverri gistingu fyrir sig */
  const centers = exploreCenters();
  const nearSel = el('select', {style:'background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:15px;color:var(--fg);max-width:100%'});
  for (const h of centers) nearSel.append(el('option', {value:h.id, selected: h.id === center.id ? '' : null}, h.kind === 'hotel' ? `${h.title}${h.start ? ` · ${fmtD(h.start)}${h.end ? ' til ' + fmtD(h.end) : ''}` : ''}` : h.title));
  nearSel.addEventListener('change', () => { store.set(`travel:xnear:${cur.id}`, nearSel.value); exploreLast = null; renderTrip(); });
  box.append(el('div', {class:'row', style:'margin:10px 0 0'}, el('span', {class:'help'}, 'Í kringum:'), nearSel));
  const chips = el('div', {class:'chips'});
  const q = el('input', {placeholder:'Eða leita sjálf, á ensku: snorkeling, tacos, market', maxlength:'60'});
  const go = el('button', {class:'btn small', type:'button'}, 'Leita');
  const res = el('div', {class:'xres'});
  const markedIds = new Set(cur.marks.map(m => m.placeId));
  const paint = (results, cached) => {
    res.innerHTML = '';
    const rest = results.filter(r => !markedIds.has(r.placeId));
    if (!results.length){ res.append(el('p', {class:'empty'}, `Ekkert fannst innan ${exploreKm()} km. Prófaðu stærri radíus eða annað orð, helst á ensku.`)); return; }
    if (!rest.length){ res.append(el('p', {class:'empty'}, 'Allt úr þessari leit er merkt, sjá efst.')); return; }
    for (const r of rest) res.append(exploreCard(r, center));
    status.textContent = `Niðurstöður með einkunn frá Google, innan ${exploreKm()} km frá ${center.title}. Leitir í dag: ${exploreCount()} af ${EXPLORE_MAX}.${cached ? ' Þessi leit var geymd frá fyrri leit.' : ''}`;
  };
  if (exploreLast && exploreLast.trip === cur.id && exploreLast.center === center.id){ q.value = exploreLast.q; paint(exploreLast.results, exploreLast.cached); }
  const run = async (query) => {
    if (!query.trim()) return;
    res.innerHTML = ''; res.append(el('p', {class:'empty'}, 'Leita…'));
    try {
      const { results, cached } = await exploreSearch(query.trim(), center, exploreKm());
      exploreLast = { trip: cur.id, center: center.id, q: query.trim(), results, cached };
      paint(results, cached);
      /* teljari dagsins, skrifaður eftir að niðurstöður eru geymdar svo endurteikning sýni þær */
      if (!cached){ try { await db.ref(`travel/team/${cur.id}/searches/${todayIso()}`).set(exploreCount() + 1); } catch(e){} }
    } catch(e){
      res.innerHTML = '';
      res.append(el('p', {class:'empty'}, e && e.message === 'max' ? `Hámarki dagsins náð (${EXPLORE_MAX} leitir). Reyndu á morgun.` : 'Leitin tókst ekki. Athugaðu að Places API (New) sé virkjað fyrir lykilinn.'));
    }
  };
  for (const [label, query] of EXPLORE_CHIPS) chips.append(el('button', {type:'button', class:'chip', onclick: () => run(query)}, label));
  /* radíus: 20 km nær t.d. yfir til Cozumel, sem er eyja; styttri radíus heldur sig við hverfið */
  const kmSel = el('select', {class:'kmsel', title:'Hve langt frá gististaðnum'});
  for (const k of EXPLORE_KMS) kmSel.append(el('option', {value:String(k), selected: k === exploreKm() ? '' : null}, `Innan ${k} km`));
  kmSel.addEventListener('change', () => { store.set(`travel:xkm:${cur.id}`, +kmSel.value); const last = exploreLast && exploreLast.trip === cur.id && exploreLast.center === center.id ? exploreLast.q : q.value; exploreLast = null; if (last && last.trim()) run(last); });
  chips.append(kmSel);
  go.onclick = () => run(q.value); q.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); run(q.value); } });
  box.append(chips, el('div', {class:'q'}, q, go));
  /* merktar tillögur: alltaf efst, geymdar með ferðinni */
  if (cur.marks.length){
    box.append(el('h3', {}, `Merktar tillögur (${cur.marks.length})`));
    const groups = {}; for (const m of cur.marks){ const k = m.near || 'Annað'; (groups[k] = groups[k] || []).push(m); }
    const order = [...centers.map(h => h.title), ...Object.keys(groups).filter(k => !centers.some(h => h.title === k))];
    for (const k of order){
      if (!groups[k]) continue;
      box.append(el('div', {class:'help', style:'margin:6px 0 6px;font-weight:600;color:var(--fg)'}, `Við ${k} (${groups[k].length})`));
      const mg = el('div', {class:'xres', style:'margin:0 0 6px'});
      const from = cur.items.find(i => i.id === groups[k][0].nearId) || centers.find(h => h.title === k) || null;
      for (const m of groups[k]) mg.append(exploreCard(m, from));
      box.append(mg);
    }
    box.append(el('h3', {}, `Leit í kringum ${center.title}`));
  }
  box.append(res);
  host.append(box);
}
async function toggleMark(r){
  const marked = cur.marks.some(m => m.placeId === r.placeId);
  try {
    if (marked) await db.ref(`travel/team/${cur.id}/marks/${r.placeId}`).remove();
    else { const { placeId, ...rest } = r; const c = exploreCenter(); await db.ref(`travel/team/${cur.id}/marks/${placeId}`).set({ ...rest, near: rest.near || (c && c.title) || null, nearId: rest.nearId || (c && c.id) || null, at: new Date().toISOString() }); }
  } catch(e){ toast('Tókst ekki: ' + (e.code || e.message)); }
}
/* fjarlægð í loftlínu frá gististaðnum, undir 10 km með einum aukastaf */
function fmtKm(km){ return km < 10 ? km.toFixed(1).replace('.', ',') + ' km' : Math.round(km) + ' km'; }
function exploreCard(r, from){
  const have = cur.ideas.find(i => i.placeId && i.placeId === r.placeId) || cur.items.find(i => i.placeId && i.placeId === r.placeId);
  const marked = cur.marks.some(m => m.placeId === r.placeId);
  const c = el('div', {class:'xcard' + (have ? ' added' : '') + (marked ? ' marked' : '')});
  if (r.photo) c.append(el('img', {src: r.photo, alt:'', loading:'lazy'}));
  const b = el('div', {class:'b'});
  b.append(el('b', {}, r.name));
  const km = (from && hasLoc(from) && r.lat != null && r.lng != null) ? fmtKm(kmBetween({ lat: +from.lat, lng: +from.lng }, { lat: +r.lat, lng: +r.lng })) : '';
  const bits = [km, r.rating ? `★ ${String(r.rating).replace('.', ',')}${r.ratingCount ? ` (${Number(r.ratingCount).toLocaleString('de-DE')})` : ''}` : '', r.type, r.price].filter(Boolean).join(' · ');
  if (bits) b.append(el('div', {class:'m'}, bits));
  const todayLine = r.hours ? openingText({ hours: r.hours, start: todayIso(), kind:'act' }) : '';
  if (todayLine) b.append(el('div', {class:'m'}, el('span', {class: /lokað/i.test(todayLine) ? 'closed' : 'open'}, todayLine.replace('Opið', 'Opið í dag').replace('Lokað þennan dag', 'Lokað í dag'))));
  if (r.addr) b.append(el('div', {class:'m'}, r.addr));
  const acts = el('div', {class:'acts'});
  acts.append(el('button', {class:'mark', type:'button', title: marked ? 'Afmerkja' : 'Merkja, fer efst', onclick: () => toggleMark(r)}, marked ? '★ Merkt' : '☆ Merkja'));
  const link = gmapsLink({ place: r.name, placeId: r.placeId, lat: r.lat, lng: r.lng });
  if (link) acts.append(el('a', {class:'maplink', href:link, target:'_blank', rel:'noopener'}, 'Google Maps ↗'));
  if (r.url) acts.append(el('a', {class:'maplink', href:r.url, target:'_blank', rel:'noopener'}, 'Vefsíða ↗'));
  if (have) acts.append(el('span', {class:'tag'}, 'Þegar í bankanum'));
  else acts.append(el('button', {class:'btn small', type:'button', onclick: async (e) => {

/* Sjálfgefinn dagur fyrir hugmynd: fyrsti heili dagur gistingarinnar sem hún fannst við, annars fyrsti ferðadagur */
function ideaDay(idea){
  const stay = idea.nearId ? cur.items.find(i => i.id === idea.nearId) : (idea.near ? cur.items.find(i => i.kind === 'hotel' && i.title === idea.near) : null);
  if (!stay || !stay.start) return cur.trip.start;
  const a = dpart(stay.start), b = dpart(stay.end || stay.start);
  const next = iso(new Date(parse(a).getTime() + 86400000));
  return next < b ? next : a;
}

/* ---------- útflutningur í dagatal (ics) ----------
   Tímar eru "fljótandi", án tímabeltis: 10:00 í Mexíkó birtist sem 10:00
   í síma sem er stilltur á Mexíkótíma. Gisting er heilsdagsviðburður. */
function icsEscape(s){ return String(s ?? '').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){ const out = []; let i = 0; while (i < line.length){ out.push((i ? ' ' : '') + line.slice(i, i + (i ? 74 : 75))); i += i ? 74 : 75; } return out.join('\r\n'); }
const icsDT = s => s.replace(/[-:]/g, '').slice(0, 15) + (s.length > 10 ? '00' : '');
function buildIcs(){
  const { trip } = cur;
  const stamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15) + 'Z';
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//multabene.is//travel//IS','CALSCALE:GREGORIAN','METHOD:PUBLISH', 'X-WR-CALNAME:' + icsEscape(trip.title)];
  for (const it of cur.items){
    if (!it.start) continue;
    const k = kindOf(it.kind);
    const desc = [it.conf ? 'Bókunarnúmer: ' + it.conf : '', it.flightNo ? 'Flug: ' + it.flightNo : '', it.price ? 'Verð: ' + it.price : '', it.note || '', it.url || '', gmapsLink(it) || ''].filter(Boolean).join('\n');
    lines.push('BEGIN:VEVENT', 'UID:' + it.id + '@multabene.is/travel/' + cur.id, 'DTSTAMP:' + stamp, 'SUMMARY:' + icsEscape((it.kind === 'hotel' ? 'Gisting: ' : '') + it.title));
    if (it.kind === 'hotel'){
      const endDate = dpart(it.end || it.start) > dpart(it.start) ? dpart(it.end) : iso(new Date(parse(it.start).getTime() + 86400000));
      lines.push('DTSTART;VALUE=DATE:' + dpart(it.start).replace(/-/g,''), 'DTEND;VALUE=DATE:' + endDate.replace(/-/g,''));
    } else {
      const st = it.start.length > 10 ? it.start : it.start + 'T09:00';
      const en = it.end ? (it.end.length > 10 ? it.end : it.end + 'T10:00') : st.slice(0,11) + pad(Math.min(23, +st.slice(11,13) + 1)) + st.slice(13);
      lines.push('DTSTART:' + icsDT(st), 'DTEND:' + icsDT(en > st ? en : st));
    }
    if (it.place) lines.push('LOCATION:' + icsEscape(it.place));
    if (it.lat != null && it.lng != null) lines.push('GEO:' + it.lat + ';' + it.lng);
    if (desc) lines.push('DESCRIPTION:' + icsEscape(desc));
    lines.push('CATEGORIES:' + icsEscape(k.label), 'END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.map(icsFold).join('\r\n') + '\r\n';
}
function exportIcs(){
  if (!cur || !cur.items.length){ toast('Engin færsla til að flytja út.'); return; }
  const blob = new Blob([buildIcs()], { type:'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = (cur.trip.title || 'ferd').replace(/[^\wáéíóúýþæðöÁÉÍÓÚÝÞÆÐÖ -]/g,'').trim().replace(/\s+/g,'-') + '.ics';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Dagatalsskrá sótt. Opnaðu hana til að bæta í dagatalið.');
}

/* ---------- klukka: staðartími á áfangastað og heima ---------- */
let clockTimer = null;
const COMMON_TZ = ['America/Cancun','America/Mexico_City','Europe/London','Europe/Copenhagen','Europe/Stockholm','Europe/Oslo','Europe/Madrid','Europe/Lisbon','Europe/Paris','Europe/Berlin','Europe/Rome','Europe/Athens','America/New_York','America/Toronto','America/Chicago','America/Denver','America/Los_Angeles','Atlantic/Canary','Asia/Bangkok','Asia/Tokyo','Asia/Dubai','Australia/Sydney','Africa/Johannesburg'];
const homeTz = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e){ return 'Atlantic/Reykjavik'; } };
const fmtClock = tz => { try { return new Intl.DateTimeFormat('is-IS', { timeZone: tz, hour:'2-digit', minute:'2-digit', hour12: false }).format(new Date()); } catch(e){ return null; } };
const tzLabel = tz => (tz || '').split('/').pop().replace(/_/g, ' ');
function renderClock(){
  clearInterval(clockTimer);
  const old = $('#clock'); if (old) old.remove();
  const tz = cur && cur.trip && cur.trip.tz; if (!tz) return;
  const home = homeTz(); if (tz === home) return;
  const node = el('span', {class:'clock', id:'clock'});
  const paint = () => { const a = fmtClock(tz), b = fmtClock(home); if (!a) return; node.innerHTML = `<span>${esc(tzLabel(tz))} <b>${a}</b></span><span>Heima <b>${b}</b></span>`; };
  paint(); $('#userbar').append(node);
  clockTimer = setInterval(paint, 30000);
}

/* ---------- prentvæn útgáfa ---------- */
function buildPrint(){
  const { trip } = cur; const owner = isOwner();
  const h = [];
  h.push(`<h1>${esc(trip.title)}</h1><div>${esc(fmtRange(trip.start, trip.end))}${trip.description ? ' · ' + esc(trip.description) : ''}</div>`);
  h.push('<h2>Dagur fyrir dag</h2>');
  for (const day of allDays()){
    const d = parse(day);
    const todays = cur.items.filter(i => i.kind !== 'hotel' && dpart(i.start) === day).sort((a,b) => a.start.localeCompare(b.start));
    const stay = stayOn(day);
    if (!todays.length && !stay) continue;
    h.push(`<div class="pday"><h3>${DOW[dow(d)]} ${d.getDate()}. ${MONTH[d.getMonth()]}${stay ? ` <small>· gisting: ${esc(stay.title)}</small>` : ''}</h3>`);
    for (const it of todays){
      const bits = [tpart(it.start) + (it.end ? ' til ' + (dpart(it.end) !== dpart(it.start) ? parse(it.end).getDate() + '. ' + MONTH_S[parse(it.end).getMonth()] + ' ' : '') + tpart(it.end) : ''), kindOf(it.kind).label, it.flightNo, it.place, owner && it.conf ? 'bókun ' + it.conf : null, it.price, it.note].filter(Boolean).map(esc);
      h.push(`<div class="pit"><b>${esc(it.title)}</b><br><small>${bits.join(' · ')}</small></div>`);
    }
    h.push('</div>');
  }
  const hs = cur.items.filter(i => i.kind === 'hotel');
  if (hs.length){
    h.push('<h2>Gisting</h2><table><tr><th>Hótel</th><th>Inn</th><th>Út</th><th>Heimilisfang</th>' + (owner ? '<th>Bókun</th>' : '') + '</tr>');
    for (const x of hs) h.push(`<tr><td>${esc(x.title)}</td><td>${esc(fmtD(x.start))} ${esc(tpart(x.start))}</td><td>${x.end ? esc(fmtD(x.end)) + ' ' + esc(tpart(x.end)) : ''}</td><td>${esc(x.place || '')}${x.note ? '<br><small>' + esc(x.note) + '</small>' : ''}</td>` + (owner ? `<td>${esc(x.conf || '')}</td>` : '') + '</tr>');
    h.push('</table>');
  }
  if (canEdit()){
    const open = cur.todos.filter(x => !x.done).sort((a,b) => (a.due || '9999').localeCompare(b.due || '9999'));
    if (open.length){
      h.push('<h2>Verkefni fyrir ferð</h2>');
      for (const t of open) h.push(`<div class="pit">☐ ${esc(t.text)}${t.due ? ` <small>· ${esc(fmtD(t.due))}</small>` : ''}${t.who ? ` <small>· ${esc(t.who)}</small>` : ''}</div>`);
    }
  }
  if (owner){
    const info = Object.values((cur.priv && cur.priv._info) || {}).sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
    if (info.length){
      h.push('<h2>Mikilvægt</h2><table>');
      for (const r of info) h.push(`<tr><th>${esc(r.label)}</th><td>${esc(r.value)}</td></tr>`);
      h.push('</table>');
    }
  }
  h.push(`<p class="pnote">Prentað ${new Date().getDate()}. ${MONTH[new Date().getMonth()]} ${new Date().getFullYear()} af www.multabene.is/travel/. Tímar eru staðartími áfangastaðar.</p>`);
  return h.join('');
}
function printTrip(){
  if (!cur || !cur.trip) return;
  $('#print').innerHTML = buildPrint();
  setTimeout(() => window.print(), 50);
}

function packTemplate(key){
  if (PACK_KIDS[key]){ const out = {}; for (const cat of PACK_CATS) out[cat] = [...(PACK_KIDS[key].items[cat] || [])]; return out; }
  const t = PACK_THEME[key] || PACK_THEME.sjor;
  const out = {};
  for (const cat of [...PACK_CATS, ...Object.keys(t.items).filter(c => !PACK_CATS.includes(c))]) out[cat] = [...(PACK_BASE[cat] || []), ...(t.items[cat] || [])];
  return out;
}
