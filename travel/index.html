  const seen = new Set();
  for (const key of ['sol', 'snjor', 'borg', 'sveit', 'utilega', 'ithrott', 'ungabarn', 'barn', 'unglingur']){
    const t = PACK_KIDS[key] || PACK_THEME[key];
    const n = Object.values(packTemplate(key)).reduce((a, b) => a + b.length, 0);
    const sample = Object.values(t.items).flat().slice(0, 4).join(', ');
    if (key === 'ungabarn') opts.append(el('div', {class:'help', style:'margin:6px 0 0'}, 'Eftir aldri, bætast ofan á listann sem er fyrir:'));
    opts.append(el('label', {class:'opt'},
      el('input', {type:'radio', name:'pkTpl', value:key, checked: (key === def || (def === 'sjor' && key === 'sol')) ? '' : null}),
      el('span', {}, el('b', {}, t.name), el('small', {}, `${n} hlutir. ${sample}, …`))));
  }
  f.append(opts);
  const forWho = whoField('');
  f.append(el('label', {}, 'Fyrir hvern (t.d. nafn barnsins)', forWho));
  const st = el('p', {class:'status'});
  f.append(el('div', {class:'row'}, el('button', {class:'btn', type:'submit'}, 'Setja inn'), el('button', {class:'btn ghost', type:'button', onclick: () => dlg.close()}, 'Hætta við')), st);
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const key = (f.querySelector('input[name=pkTpl]:checked') || {}).value || def;
    try { await addTemplate(key, forWho.value()); dlg.close(); }
    catch(err){ st.textContent = 'Vistun tókst ekki: ' + (err.code || err.message) + (err.code === 'PERMISSION_DENIED' ? '. Reglan "team" vantar í Firebase.' : ''); st.classList.add('err'); }
  });
  inner.append(f); dlg.showModal();
}
/* Sami hlutur bætist ekki við tvisvar fyrir sama nafn, en má vera til fyrir tvö börn */
async function addTemplate(key, by){
  const tpl = packTemplate(key);
  const have = new Set(cur.packing.map(x => ((x.text || '') + '|' + (x.by || '')).toLowerCase()));
  const upd = {}; let n = 0; const now = new Date().toISOString();
  for (const cat in tpl) for (const t of tpl[cat]){ const k = (t + '|' + (by || '')).toLowerCase(); if (have.has(k)) continue; have.add(k); upd[`travel/team/${cur.id}/packing/${rnd(10)}`] = { text: t, cat, done: false, by: by || null, created: now }; n++; }
  if (!n){ toast('Allt úr listanum er þegar á listanum.'); return; }
  await db.ref().update(upd); toast(`${n} hlutir settir á listann${by ? ' fyrir ' + by : ''}`); logChange(`Setti grunnlista í pökkun (${(PACK_KIDS[key] || PACK_THEME[key] || {}).name || key}${by ? ', fyrir ' + by : ''})`);
}
/* Nýr hlutur (margir í einu, einn í hverja línu) eða breyta hlut sem er til: texti, flokkur, nafn */
function openPackDialog(it){
  const dlg = $('#dlg'), inner = $('#dlgInner'); inner.innerHTML = '';
  const editing = !!(it && it.id);
  inner.append(el('h2', {}, editing ? 'Breyta hlut' : 'Bæta á pökkunarlista'));
  const f = el('form', {class:'form'});
  const text = editing ? el('input', {id:'pkText', maxlength:'80', required:'', value: it.text || ''}) : el('textarea', {id:'pkText', rows:'4', placeholder:'Einn hlutur í hverja línu'});
  const cat = el('select', {id:'pkCat'});
  const cats = [...new Set(PACK_CATS.concat(cur.packing.map(x => x.cat).filter(c => c && !PACK_CATS.includes(c)), editing && it.cat && !PACK_CATS.includes(it.cat) ? [it.cat] : []))];
  for (const c of cats) cat.append(el('option', {value:c, selected: editing && (it.cat || 'Annað') === c ? '' : null}, c));
  const by = whoField(editing ? it.by : '');
  f.append(el('label', {class:'full'}, editing ? 'Hlutur' : 'Hlutir', text), el('label', {}, 'Flokkur', cat), el('label', {}, 'Fyrir hvern', by));
  const st = el('p', {class:'status'});
  f.append(el('div', {class:'row'}, el('button', {class:'btn', type:'submit'}, editing ? 'Vista' : 'Bæta við'), el('button', {class:'btn ghost', type:'button', onclick: () => dlg.close()}, 'Hætta við')), st);
  f.addEventListener('submit', async e => {
    e.preventDefault(); st.className = 'status';
    if (editing){
      const t = text.value.trim();
      if (!t){ st.textContent = 'Hluturinn þarf texta.'; st.classList.add('err'); return; }
      try { await db.ref(`travel/team/${cur.id}/packing/${it.id}`).update({ text: t.slice(0, 80), cat: cat.value, by: by.value() }); dlg.close(); toast('Vistað'); }
      catch(err){ st.textContent = 'Vistun tókst ekki: ' + (err.code || err.message); st.classList.add('err'); }
      return;
    }
    const lines = text.value.split('\n').map(x => x.trim()).filter(Boolean);
    if (!lines.length){ st.textContent = 'Skrifaðu að minnsta kosti einn hlut.'; st.classList.add('err'); return; }
    const upd = {}; const now = new Date().toISOString();
    for (const t of lines) upd[`travel/team/${cur.id}/packing/${rnd(10)}`] = { text: t.slice(0, 80), cat: cat.value, done: false, by: by.value(), created: now };
    try { await db.ref().update(upd); dlg.close(); toast(`${lines.length} ${lines.length === 1 ? 'hlutur' : 'hlutir'} á listann`); }
    catch(err){ st.textContent = 'Vistun tókst ekki: ' + (err.code || err.message) + (err.code === 'PERMISSION_DENIED' ? '. Reglan "team" vantar í Firebase.' : ''); st.classList.add('err'); }
  });
  inner.append(f); dlg.showModal(); text.focus();
}

const dayDiff = (a, b) => Math.round((parse(a) - parse(b)) / 86400000);

function renderTodos(host){

      el('button', {class:'x', type:'button', title:'Eyða', onclick: async () => { if (!confirm(`Eyða "${it.text}"?`)) return; try { await db.ref(`travel/team/${cur.id}/todos/${it.id}`).remove(); logChange(`Eyddi verkefni: "${it.text}"`); } catch(e){ toast('Tókst ekki.'); } }}, '×'));

async function addTodoTemplate(){
  const have = new Set(cur.todos.map(x => (x.text || '').toLowerCase()));
  const upd = {}; let n = 0; const now = new Date().toISOString();
  for (const [text, days] of TODO_BASE){
    if (have.has(text.toLowerCase())) continue;
    const d = parse(cur.trip.start); d.setDate(d.getDate() - days);
    upd[`travel/team/${cur.id}/todos/${rnd(10)}`] = { text, due: iso(d), who: null, done: false, created: now }; n++;
  }
  if (!n){ toast('Allt úr grunnlistanum er þegar á listanum.'); return; }
  try { await db.ref().update(upd); toast(`${n} verkefni sett á listann`); logChange(`Setti ${n} verkefni úr grunnlista`); }
  catch(err){ toast('Vistun tókst ekki: ' + (err.code || err.message) + (err.code === 'PERMISSION_DENIED' ? '. Reglan "team" vantar í Firebase.' : '')); }
}
function openTodoDialog(it){
  const dlg = $('#dlg'), inner = $('#dlgInner'); inner.innerHTML = '';
  const editing = !!(it && it.id);
  inner.append(el('h2', {}, editing ? 'Breyta verkefni' : 'Nýtt verkefni'));
  const f = el('form', {class:'form'});
  const text = el('input', {id:'tdText', maxlength:'120', required:'', placeholder:'t.d. Sækja um ESTA', value: editing ? (it.text || '') : ''});
  const due = el('input', {id:'tdDue', type:'date', value: editing ? (it.due || '') : ''});
  const who = whoField(editing ? it.who : '', 'Allir');
  f.append(el('label', {class:'full'}, 'Verkefni', text), el('label', {}, 'Skiladagur (valkvætt)', due), el('label', {}, 'Ábyrgð', who));
  const st = el('p', {class:'status'});
  f.append(el('div', {class:'row'}, el('button', {class:'btn', type:'submit'}, editing ? 'Vista' : 'Bæta við'), el('button', {class:'btn ghost', type:'button', onclick: () => dlg.close()}, 'Hætta við')), st);
  f.addEventListener('submit', async e => {

    const data = { text: t, due: due.value || null, who: who.value() };

      else await db.ref(`travel/team/${cur.id}/todos/${rnd(10)}`).set({ ...data, done: false, created: new Date().toISOString() });
      dlg.close(); toast('Vistað'); logChange(`${editing ? 'Breytti' : 'Nýtt'} verkefni: "${t}"`);
    } catch(err){ st.textContent = 'Vistun tókst ekki: ' + (err.code || err.message) + (err.code === 'PERMISSION_DENIED' ? '. Reglan "team" vantar í Firebase.' : ''); st.classList.add('err'); }
  });

}

/* ---------- kostnaður: les upphæð og gjaldmiðil úr frjálsum texta ----------
   Dæmi: "121.384,00 kr.", "US$905.62", "USD 1,007.45", "$812.67", "257,84 CAD", "4.200 MXN" */
const CUR_PATTERNS = [
  ['ISK', /\bISK\b|kr\.?(?![a-záðéíóúýþæö])/i],
  ['USD', /US\$|\bUSD\b/i],
  ['CAD', /CA\$|C\$|\bCAD\b/i],
  ['MXN', /MX\$|MXN|\bpesos?\b/i],
  ['EUR', /€|\bEUR\b/i],
  ['GBP', /£|\bGBP\b/i],
  ['DKK', /\bDKK\b/i], ['NOK', /\bNOK\b/i], ['SEK', /\bSEK\b/i]
];
function parsePrice(str){
  if (!str) return null;
  let cur = null;
  for (const [c, re] of CUR_PATTERNS) if (re.test(str)){ cur = c; break; }
  if (!cur && /\$/.test(str)) cur = 'USD';
  const m = str.replace(/\s/g, '').match(/\d[\d.,]*\d|\d/);
  if (!m) return null;
  let num = m[0];
  const lastDot = num.lastIndexOf('.'), lastComma = num.lastIndexOf(',');
  let dec = null;
  if (lastDot >= 0 && lastComma >= 0) dec = lastDot > lastComma ? '.' : ',';
  else if (lastDot >= 0 || lastComma >= 0){
    const sep = lastDot >= 0 ? '.' : ',';
    const after = num.length - 1 - Math.max(lastDot, lastComma);
    const count = num.split(sep).length - 1;
    dec = (after === 2 && count === 1) ? sep : null;      /* "257,84" er tugabrot, "121.384" er þúsund */
  }
  let amount;
  if (dec){ const other = dec === '.' ? ',' : '.'; amount = parseFloat(num.split(other).join('').replace(dec, '.')); }
  else amount = parseFloat(num.replace(/[.,]/g, ''));
  if (!isFinite(amount)) return null;
  if (!cur) cur = 'ISK';
  return { amount, cur };
}
const fmtAmt = (n, cur) => cur === 'ISK' || cur === 'MXN' && n >= 1000 ? Math.round(n).toLocaleString('de-DE') : n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/* Gengi dagsins: Seðlabanki Evrópu (frankfurter.dev), varaleið open.er-api.com. Geymt í síma í 12 klst. */
let fxState = { rates: null, date: null, loading: false, failed: false };
async function fetchRates(){
  const cached = store.get('travel:fx', null);
  if (cached && Date.now() - cached.at < 12 * 3600 * 1000){ fxState = { rates: cached.rates, date: cached.date, loading: false, failed: false }; return fxState; }
  fxState.loading = true;
  const want = ['USD','CAD','MXN','EUR','GBP','DKK','NOK','SEK'];
  try {
    let rates = {}, date = null;
    try {
      const r = await fetch(`https://api.frankfurter.dev/v1/latest?base=ISK&symbols=${want.join(',')}`);
      if (!r.ok) throw new Error('fx');
      const j = await r.json();
      for (const c of want) if (j.rates && j.rates[c]) rates[c] = 1 / j.rates[c];
      date = j.date;
    } catch(e){
      const r = await fetch('https://open.er-api.com/v6/latest/ISK');
      if (!r.ok) throw new Error('fx2');
      const j = await r.json();
      for (const c of want) if (j.rates && j.rates[c]) rates[c] = 1 / j.rates[c];
      date = (j.time_last_update_utc || '').slice(0, 16);
    }
    if (!Object.keys(rates).length) throw new Error('empty');
    fxState = { rates, date, loading: false, failed: false };
    store.set('travel:fx', { rates, date, at: Date.now() });
  } catch(e){ fxState = { rates: null, date: null, loading: false, failed: true }; }
  return fxState;
}
function renderCosts(host){
  const manual = (cur.trip.rates) || {};
  const auto = fxState.rates || {};
  const rates = { ...auto, ...manual };
  const toIsk = p => p.cur === 'ISK' ? p.amount : (rates[p.cur] ? p.amount * rates[p.cur] : null);
  /* flokka eftir gerð, svo eftir gjaldmiðli */
  const groups = {}, bad = [], allCur = new Set();
  let total = 0, missing = false;
  for (const it of cur.items){
    if (!it.price) continue;
    const p = parsePrice(it.price);
    if (!p){ bad.push(it); continue; }
    allCur.add(p.cur);
    const g = groups[it.kind] || (groups[it.kind] = { byCur: {}, isk: 0, missing: false, n: 0 });
    g.byCur[p.cur] = (g.byCur[p.cur] || 0) + p.amount; g.n++;
    const isk = toIsk(p);
    if (isk == null){ g.missing = true; missing = true; } else { g.isk += isk; total += isk; }
  }
  const card = el('div', {class:'card'}, el('h2', {}, 'Kostnaður'));
  const order = ['hotel','flight','move','act','note'];
  const kinds = order.filter(k => groups[k]);
  if (!kinds.length && !bad.length){ card.append(el('p', {class:'empty'}, 'Engin verð skráð enn. Verðreiturinn á færslum má vera í hvaða rithætti sem er, til dæmis "121.384 kr.", "US$905.62" eða "257,84 CAD".')); host.append(card); return; }
  const list = el('div', {class:'info-view'});
  for (const k of kinds){
    const g = groups[k];
    const curs = Object.keys(g.byCur).sort();
    const parts = curs.map(c => `${fmtAmt(g.byCur[c], c)} ${c}`).join(' + ');
    list.append(el('div', {class:'kv'},
      el('b', {}, `${kindOf(k).label} (${g.n})`),
      el('span', {}, parts),
      el('span', {style:'font-weight:700;white-space:nowrap'}, g.missing ? (g.isk ? `≥ ${fmtAmt(g.isk, 'ISK')} kr.` : 'gengi vantar') : `${fmtAmt(g.isk, 'ISK')} kr.`)));
  }
  card.append(list);
  card.append(el('p', {style:'margin:12px 0 0;font-weight:700;font-size:17px'}, `Samtals ${missing ? 'að minnsta kosti ' : ''}${fmtAmt(total, 'ISK')} kr.` + (missing ? ' (gengi vantar fyrir hluta)' : '')));
  /* skipting á þátttakendur: hlutur hvers og hvað hver lagði út */
  if (cur.people.length && kinds.length){
    const ids = cur.people.map(p => p.id);
    /* greiðandi: sá sem þátttakandi fylgir, annars hann sjálfur (hámark 3 skref) */
    const payerOf = id => { let cur_ = id; for (let i = 0; i < 3; i++){ const p = cur.people.find(x => x.id === cur_); if (!p || !p.follows || !ids.includes(p.follows)) break; cur_ = p.follows; } return cur_; };
    const share = {}, paid = {}; for (const id of ids){ share[id] = 0; paid[id] = 0; }
    let skipped = 0;
    for (const it of cur.items){
      if (!it.price) continue;
      const p = parsePrice(it.price); if (!p) continue;
      const isk = toIsk(p); if (isk == null){ skipped++; continue; }
      let sh = (it.split || []).filter(id => ids.includes(id)); if (!sh.length) sh = ids;
      for (const id of sh) share[payerOf(id)] += isk / sh.length;
      if (it.paidBy && paid[it.paidBy] != null) paid[payerOf(it.paidBy)] += isk;
    }
    card.append(el('h3', {style:'font-size:16px;margin:16px 0 4px'}, 'Á mann'));
    const pl = el('div', {class:'info-view'});
    for (const p of cur.people){
      if (payerOf(p.id) !== p.id) continue;
      const deps = cur.people.filter(q => q.id !== p.id && payerOf(q.id) === p.id).map(q => q.name);
      const diff = paid[p.id] - share[p.id];
      pl.append(el('div', {class:'kv'}, el('b', {}, p.name, deps.length ? el('small', {style:'display:block;font-weight:400;color:var(--dim)'}, 'með ' + deps.join(', ')) : null),
        el('span', {}, `Hlutur ${fmtAmt(share[p.id], 'ISK')} kr. · lagði út ${fmtAmt(paid[p.id], 'ISK')} kr.`),
        el('span', {style:'font-weight:700;white-space:nowrap;color:' + (diff > 0.5 ? 'var(--accent)' : diff < -0.5 ? 'var(--danger)' : 'var(--dim)')}, diff > 0.5 ? `á inni ${fmtAmt(diff, 'ISK')} kr.` : diff < -0.5 ? `skuldar ${fmtAmt(-diff, 'ISK')} kr.` : 'jafnt')));
    }
    card.append(pl, el('p', {class:'help', style:'margin:8px 0 0'}, 'Hlutur fer eftir "Kostnaður skiptist á" í hverri færslu, annars skiptist jafnt á alla. Hlutur þess sem fylgir öðrum rennur í hlut greiðandans. "Greitt af" skráir hver lagði út.' + (skipped ? ` ${skipped} ${skipped === 1 ? 'færsla' : 'færslur'} ekki með vegna þess að gengi vantar.` : '')));
  } else if (kinds.length && !cur.people.length){
    card.append(el('p', {class:'help', style:'margin:8px 0 0'}, 'Skráðu þátttakendur hér fyrir ofan til að sjá kostnað á mann og hver skuldar hverjum.'));
  }
  /* gengi */
  const foreign = [...allCur].filter(c => c !== 'ISK').sort();
  const foreignNow = foreign.filter(c => !rates[c]);
  if (foreignNow.length && !fxState.loading && !fxState.failed){ fetchRates().then(() => { if (cur && cur.tab === 'stillingar') renderTrip(); }); }
  if (foreign.length){
    const src = fxState.loading && foreignNow.length ? 'Sæki gengi dagsins…' : fxState.date ? `Gengi Seðlabanka Evrópu, ${fxState.date}. Sótt sjálfkrafa.` : fxState.failed ? 'Náði ekki í gengi dagsins. Skráðu gengi hér fyrir neðan.' : '';
    if (src) card.append(el('p', {class:'help', style:'margin:8px 0 0'}, src + ' ' + foreign.filter(c => rates[c]).map(c => `1 ${c} = ${rates[c].toFixed(2)} kr.${manual[c] ? ' (þitt gengi)' : ''}`).join(' · ')));
    const det = el('details', {style:'margin-top:12px'});
    det.append(el('summary', {style:'cursor:pointer;color:var(--dim);font-size:14px'}, 'Nota eigið gengi í stað gengis dagsins'));
    const f = el('form', {class:'form', style:'margin-top:10px'});
    f.append(el('div', {class:'full help'}, 'Til dæmis gengið sem kortið þitt notaði. Tómt = gengi dagsins. Gildir aðeins fyrir þessa ferð.'));
    const inputs = {};
    for (const c of foreign){ inputs[c] = el('input', {type:'number', step:'0.01', min:'0', placeholder: auto[c] ? auto[c].toFixed(2) : 'kr. fyrir 1 ' + c, value: manual[c] || ''}); f.append(el('label', {}, `1 ${c} =`, inputs[c])); }
    const st = el('p', {class:'status'});
    f.append(el('div', {class:'row'}, el('button', {class:'btn small', type:'submit'}, 'Vista gengi')), st);
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const r = {}; for (const c of foreign){ const v = parseFloat(inputs[c].value); if (v > 0) r[c] = v; }
      try { await db.ref(`travel/trips/${cur.id}/rates`).set(Object.keys(r).length ? r : null); toast('Gengi vistað'); } catch(err){ st.textContent = 'Vistun tókst ekki.'; st.classList.add('err'); }
    });
    det.append(f); card.append(det);
  }
  if (bad.length) card.append(el('p', {class:'help', style:'margin-top:10px'}, 'Skildi ekki verðið á: ' + bad.map(b => `"${b.price}" (${b.title})`).join(', ') + '. Skrifaðu tölu og gjaldmiðil, til dæmis "905.62 USD".'));
  host.append(card);
}

    try { await db.ref(`travel/trips/${cur.id}/people/${rnd(10)}`).set({ name: n.slice(0, 40), follows: pfSel && pfSel.value || null, created: new Date().toISOString() }); pn.value = ''; if (pfSel) pfSel.value = ''; logChange(`Bætti við þátttakanda: ${n}`); } catch(err){ toast('Tókst ekki: ' + (err.code || err.message)); }
  });
  pc.append(pf, el('p', {class:'help', style:'margin:8px 0 0'}, '"Fylgir" er fyrir börn og aðra sem borga ekki sjálfir. Hlutur þeirra í kostnaði rennur í hlut þess sem þeir fylgja.'));
  host.append(pc);
  const nPriv = Object.entries(cur.priv || {}).filter(([k, x]) => k !== '_info' && x && (x.conf || x.price)).length;
  const nPub = Object.values(cur.trip.items || {}).filter(x => x && (x.conf || x.price)).length;
  host.append(el('div', {class:'card'}, el('h2', {}, 'Bókunarnúmer og verð'),
    el('p', {class:'help'}, `Einkahólf: ${cur.privOk === true ? 'opið' : cur.privOk === false ? 'lokað (' + (cur.privErr || '') + ')' : 'ekki svarað enn'}. Bókunarnúmer og verð: ${nPriv} ${nPriv === 1 ? 'færsla' : 'færslur'} í einkahólfi, ${nPub} í opna hlutanum. Gestir sjá aðeins opna hlutann.`)));
  renderCosts(host);
  host.append(el('div', {class:'card'}, el('h2', {}, 'Dagatal símans'),
    el('p', {class:'help', style:'margin:0 0 10px'}, 'Sækir ics-skrá með öllum færslum. Opnaðu hana í símanum og veldu að bæta í dagatalið. Tímar eru staðartími áfangastaðar. Skráin uppfærist ekki sjálfkrafa, sæktu hana aftur eftir breytingar.'),
    el('button', {class:'btn small', type:'button', onclick: exportIcs}, 'Sækja í dagatal (.ics)')));
  host.append(tripForm(cur.trip));
}

/* ---------- ritstjóralykill: travel/editkeys/{tid}, aðeins eigandi les ---------- */
function loadEditKey(){
  if (!cur || !isOwner()) return;
  db.ref(`travel/editkeys/${cur.id}`).once('value').then(snap => { if (!cur) return; cur.editKey = snap.val() || null; cur.editKeyErr = null; if (cur.tab === 'stillingar') renderTrip(); })
    .catch(err => { if (!cur) return; cur.editKey = null; cur.editKeyErr = err && (err.code || err.message) || 'villa'; if (cur.tab === 'stillingar') renderTrip(); });
}
async function rotateEditKey(revoke){
  if (revoke && !confirm('Búa til nýjan ritstjórahlekk? Gamli hlekkurinn hættir að virka og allir ritstjórar missa réttindin þar til þeir opna nýja hlekkinn.')) return;
  const key = rnd(16);
  const upd = { [`travel/editkeys/${cur.id}`]: key };
  if (revoke){ upd[`travel/trips/${cur.id}/editors`] = null; upd[`travel/claims/${cur.id}`] = null; }
  try { await db.ref().update(upd); cur.editKey = key; cur.editKeyErr = null; toast(revoke ? 'Nýr hlekkur. Ritstjórar afturkallaðir.' : 'Ritstjórahlekkur tilbúinn'); if (revoke) logChange('Afturkallaði alla ritstjóra'); renderTrip(); }
  catch(err){ toast('Tókst ekki: ' + (err.code || err.message) + (err.code === 'PERMISSION_DENIED' ? '. Reglan "editkeys" vantar í Firebase.' : '')); }
}

/* ---------- færsla: nýtt, breyta, tillaga ---------- */
function openItemDialog(it, asSuggestion, opts={}){
  const dlg = $('#dlg'), inner = $('#dlgInner'); inner.innerHTML = '';
  const isNew = !it || !it.id;
  inner.append(el('h2', {}, asSuggestion ? 'Senda tillögu' : isNew ? 'Ný færsla' : 'Breyta færslu'));
  if (asSuggestion) inner.append(el('p', {class:'help', style:'margin:0 0 12px'}, 'Tillagan fer til eiganda ferðarinnar sem samþykkir hana eða hafnar.'));
  const f = el('form', {class:'form'});
  const v = it || { kind:'act', start: (cur.trip.start || todayIso()) + 'T10:00', end:'' };
  const kind = el('select', {id:'iKind'});
  for (const k in KINDS) kind.append(el('option', {value:k, selected: v.kind === k ? '' : null}, KINDS[k].label));
  const title = el('input', {id:'iTitle', maxlength:'100', required:'', placeholder:'t.d. Hotel Playa Norte', value: v.title || ''});
  const start = el('input', {id:'iStart', type:'datetime-local', required:'', value: v.start || ''});
  const end = el('input', {id:'iEnd', type:'datetime-local', value: v.end || '', min: v.start || null});
  /* Lok mega ekki vera á undan byrjun. Tóm lok fá sjálfgefið gildi:
     gisting næsta dag kl. 11:00, annað tveimur tímum síðar. */
  const addMinutes = (dt, mins) => { const d = new Date(dt); if (isNaN(d)) return ''; d.setMinutes(d.getMinutes() + mins); return `${iso(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  start.addEventListener('change', () => {
    if (!start.value) return;
    end.min = start.value;
    if (!end.value || end.value < start.value){
      end.value = kind.value === 'hotel' ? dpart(addMinutes(start.value, 24*60)) + 'T11:00' : addMinutes(start.value, 120);
    }
  });
  const place = el('input', {id:'iPlace', maxlength:'200', placeholder: MAPS_READY ? 'Leitaðu að stað eða heimilisfangi' : 'Heiti staðar eða heimilisfang', value: v.place || '', autocomplete:'off'});
  const gl = el('input', {id:'iLink', placeholder:'Límdu hlekk úr Google Maps, eða hnit', value:''});
  const conf = el('input', {id:'iConf', maxlength:'60', placeholder:'Bókunarnúmer', value: v.conf || ''});
  const flightNo = el('input', {id:'iFlight', maxlength:'10', placeholder:'t.d. FI 681', value: v.flightNo || '', autocapitalize:'characters'});
  const flightLabel = el('label', {}, 'Flugnúmer', flightNo);
  const price = el('input', {id:'iPrice', maxlength:'40', placeholder:'t.d. 4.200 MXN', value: v.price || ''});
  const url = el('input', {id:'iUrl', type:'url', placeholder:'https://…', value: v.url || ''});
  const note = el('textarea', {id:'iNote', rows:'3', maxlength:'600'}); note.value = v.note || '';
  const by = el('input', {id:'iBy', maxlength:'40', placeholder:'Nafnið þitt', value: store.get('travel:name', '')});
  let loc = { lat: v.lat ?? null, lng: v.lng ?? null, placeId: v.placeId || null };
  let info = { rating: v.rating ?? null, ratingCount: v.ratingCount ?? null, hours: v.hours || null };
  const locInfo = el('span', {class:'help', style:'font-size:12px'});
  const paintLoc = () => { locInfo.textContent = loc.lat != null ? `Staðsetning á korti: ${(+loc.lat).toFixed(4)}, ${(+loc.lng).toFixed(4)}` : 'Engin staðsetning á korti enn.'; };
  paintLoc();
  gl.addEventListener('input', () => { const c = coordsFromLink(gl.value); if (c){ loc = { ...c, placeId: null }; paintLoc(); } });
  place.addEventListener('input', () => { if (!MAPS_READY) return; });

  /* Hverjir fara: þátttakendur ferðarinnar, ekkert valið = allir */
  let who = Array.isArray(v.who) ? v.who.slice() : [];
  const chipRow = (ids, onToggle) => el('div', {class:'chips'}, ...cur.people.map(p => el('button', {type:'button', class:'chip', 'aria-pressed': String(ids.includes(p.id)), onclick: e => { const b = e.currentTarget; const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on)); onToggle(p.id, on); }}, p.name)));
  const whoWrap = cur.people.length ? el('div', {class:'full'}, el('div', {class:'help', style:'font-size:13px;margin:0 0 6px'}, 'Hverjir fara (ekkert valið = allir)'), chipRow(who, (id, on) => { who = on ? who.concat(id) : who.filter(x => x !== id); })) : null;
  /* Kostnaðarskipting, aðeins eigandi: hver greiddi og hverjir skipta með sér */
  let split = Array.isArray(v.split) ? v.split.slice() : [];
  const paidSel = el('select', {id:'iPaid'}); paidSel.append(el('option', {value:''}, 'Ekki skráð'));
  for (const p of cur.people) paidSel.append(el('option', {value:p.id, selected: v.paidBy === p.id ? '' : null}, p.name));
  const costOk = isOwner() && !asSuggestion && cur.people.length > 0;
  const paidLabel = costOk ? el('label', {}, 'Greitt af', paidSel) : null;
  const splitWrap = costOk ? el('div', {class:'full'}, el('div', {class:'help', style:'font-size:13px;margin:0 0 6px'}, 'Kostnaður skiptist á (ekkert valið = alla)'), chipRow(split, (id, on) => { split = on ? split.concat(id) : split.filter(x => x !== id); })) : null;
  const kindLabel = el('label', {}, 'Gerð', kind);
  const endLabel = el('label', {}, 'Endar', end);
  const paintKind = () => { const h = kind.value === 'hotel'; endLabel.firstChild.textContent = h ? 'Útritun' : 'Endar'; f.querySelector('#iStartL').firstChild.textContent = h ? 'Innritun' : 'Byrjar'; flightLabel.hidden = kind.value !== 'flight'; };
  kind.addEventListener('change', paintKind);
  const placeWrap = el('label', {class:'full'}, 'Staður', place);
  f.append(
    kindLabel,
    el('label', {class:'full'}, 'Heiti', title),
    el('label', {id:'iStartL'}, 'Byrjar', start),
    endLabel,
    placeWrap,
    el('label', {class:'full'}, 'Google Maps hlekkur eða hnit (valkvætt)', gl),
    el('div', {class:'full'}, locInfo),
    flightLabel,
    whoWrap,
    asSuggestion || !isOwner() ? null : el('label', {}, 'Bókunarnúmer', conf),
    asSuggestion || !isOwner() ? null : el('label', {}, 'Verð', price),
    paidLabel,
    splitWrap,
    el('label', {class:'full'}, 'Hlekkur á bókun', url),
    el('label', {class:'full'}, 'Athugasemd', note)
  );
  if (asSuggestion) f.prepend(el('label', {class:'full'}, 'Frá hverjum', by));
  const st = el('p', {class:'status'});
  const row = el('div', {class:'row'},
    el('button', {class:'btn', type:'submit'}, asSuggestion ? 'Senda tillögu' : 'Vista'),
    el('button', {class:'btn ghost', type:'button', onclick: () => dlg.close()}, 'Hætta við'));
  if (!isNew && !asSuggestion) row.append(el('button', {class:'btn danger', type:'button', style:'margin-left:auto', onclick: async () => {
    if (!confirm(`Eyða "${it.title}"?`)) return;
    const del = { [`travel/trips/${cur.id}/items/${it.id}`]: null }; if (isOwner()) del[`travel/private/${cur.id}/${it.id}`] = null;
    try { await db.ref().update(del); dlg.close(); toast('Færslu eytt'); logChange(`Eyddi: "${it.title}"`); } catch(e){ st.textContent = 'Tókst ekki að eyða.'; st.classList.add('err'); }
  }}, 'Eyða'));
  f.append(row, st);
  inner.append(f);
  dlg.showModal();
  paintKind();

  /* Google staðaleit, nýja vefeiningin */
  if (MAPS_READY){
    loadMaps().then(async () => {
      if (!google.maps.places || !google.maps.places.PlaceAutocompleteElement) return;
      try { await google.maps.importLibrary('places'); } catch(e){}
      const pac = new google.maps.places.PlaceAutocompleteElement();
      pac.id = 'iPac';
      placeWrap.firstChild.textContent = 'Staður (leit)';
      place.hidden = true;
      placeWrap.append(pac);
      const onPick = async (ev) => {
        try {
          const p = ev.placePrediction ? ev.placePrediction.toPlace() : ev.place;
          await p.fetchFields({ fields: ['displayName','formattedAddress','location','id','rating','userRatingCount','regularOpeningHours','websiteURI'] });
          const name = p.displayName || ''; const addr = p.formattedAddress || '';
          place.value = name && addr && !addr.startsWith(name) ? `${name}, ${addr}` : (addr || name);
          loc = { lat: p.location.lat(), lng: p.location.lng(), placeId: p.id || null };
          info = { rating: p.rating || null, ratingCount: p.userRatingCount || null, hours: (p.regularOpeningHours && p.regularOpeningHours.weekdayDescriptions) || null };
          paintLoc();
          if (info.rating) locInfo.textContent += ` · ★ ${info.rating}${info.hours ? ', opnunartímar sóttir' : ''}`;
          if (!title.value.trim() && name) title.value = name;
          if (!url.value && p.websiteURI) url.value = p.websiteURI;
        } catch(e){ toast('Náði ekki í staðinn.'); }
      };
      pac.addEventListener('gmp-select', onPick);
      pac.addEventListener('gmp-placeselect', onPick);
    }).catch(() => {});
  }

  f.addEventListener('submit', async e => {
    e.preventDefault(); st.className = 'status';
    const data = {
      kind: kind.value, title: title.value.trim(), start: start.value, end: end.value || null, place: place.value.trim() || null,
      lat: loc.lat != null ? +loc.lat : null, lng: loc.lng != null ? +loc.lng : null, placeId: loc.placeId || null,
      conf: conf.value.trim() || null, price: price.value.trim() || null, url: url.value.trim() || null, note: note.value.trim() || null,
      flightNo: kind.value === 'flight' ? (flightNo.value.trim().toUpperCase() || null) : null,
      who: who.length ? who : null,
      rating: info.rating, ratingCount: info.ratingCount, hours: info.hours,
      ideaId: opts.ideaId || v.ideaId || null
    };
    if (!data.title || !data.start){ st.textContent = 'Heiti og byrjun þarf.'; st.classList.add('err'); return; }
    if (data.end && data.end < data.start){ st.textContent = 'Lok eru á undan byrjun.'; st.classList.add('err'); return; }
    if (data.kind === 'hotel' && !data.end){ st.textContent = 'Gisting þarf útritunardag.'; st.classList.add('err'); return; }
    st.textContent = 'Vistar…';
    try {
      if (asSuggestion){
        const name = by.value.trim() || 'gestur'; store.set('travel:name', name);
        await db.ref(`travel/trips/${cur.id}/suggestions`).push({ ...data, by: name, created: new Date().toISOString() });
        dlg.close(); toast('Tillaga send. Eigandi ferðarinnar fær hana til samþykktar.');
      } else {
        const iid = isNew ? rnd(12) : it.id;
        const { conf: confVal, price: priceVal, ...pub } = data;
        const upd = { [`travel/trips/${cur.id}/items/${iid}`]: pub };
        if (isOwner()) upd[`travel/private/${cur.id}/${iid}`] = { conf: confVal || null, price: priceVal || null, paidBy: paidSel.value || null, split: split.length ? split : null };
        if (opts.ideaId) upd[`travel/trips/${cur.id}/ideas/${opts.ideaId}/scheduled`] = iid;
        await db.ref().update(upd);
        dlg.close(); toast(opts.ideaId ? 'Hugmynd komin á dagskrá' : 'Vistað');
        logChange(`${isNew ? 'Bætti við' : 'Breytti'}: ${kindOf(data.kind).label} "${data.title}"${data.start ? ' ' + fmtD(data.start) : ''}`);
      }
    } catch(err){ st.textContent = 'Vistun tókst ekki: ' + (err.code || err.message) + (err.code === 'PERMISSION_DENIED' && isEditor() ? '. Reglurnar fyrir ritstjóra vantar í Firebase.' : ''); st.classList.add('err'); }
  });
}

/* ------------------------------------------------------------------
   Ræsing
------------------------------------------------------------------ */
let firstLoad = true;
function go(){
  /* Fyrsta opnun án slóðar, til dæmis úr heimaskjásappi: fara beint í síðustu ferð */
  if (firstLoad){
    firstLoad = false;
    const last = store.get('travel:last', null);
    if (!location.hash && last && store.get(`travel:cache:${last}`, null)){ location.hash = `#t/${last}`; return; }
  }
  const r = route();
  if (r.view === 'home'){ const f = $('#fab'); if (f) f.remove(); renderHome(); renderUserbar(); }
  else openTrip(r);
}
window.addEventListener('hashchange', go);
if (!auth) go();

/* Án nets: service worker geymir síðuna sjálfa, localStorage geymir ferðina */
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('/travel/sw.js').catch(() => {});
}
function paintOnline(){ if (cur && cur.trip) renderTrip(); }
window.addEventListener('online', paintOnline);
window.addEventListener('offline', paintOnline);
</script>
