<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel</title>
<meta name="description" content="Ferðaáætlun: gisting, flug, afþreying og allt sem er bókað, dag fyrir dag, í dagatali og á korti.">
<meta name="robots" content="noindex">
<link rel="manifest" href="/travel/manifest.json">
<meta name="theme-color" content="#0F7C8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Travel">
<meta property="og:type" content="website">
<meta property="og:site_name" content="multabene.is">
<meta property="og:title" content="Travel">
<meta property="og:description" content="Ferðaáætlun: gisting, flug, afþreying og allt sem er bókað, dag fyrir dag, í dagatali og á korti.">
<meta property="og:url" content="https://www.multabene.is/travel/">
<meta property="og:image" content="https://www.multabene.is/apple-touch-icon.png">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Þemu skipta um þessar breytur, sjá THEMES í kóðanum */
  :root{
    --bg:#F3F6F6;
    --panel:#FFFFFF;
    --panel-2:#E9EFF0;
    --line:#D5DEE0;
    --fg:#17262B;
    --dim:#5F7378;
    --accent:#0F7C8C;
    --accent-soft:#D7EDF0;
    --hotel:#4F5BD5;
    --flight:#3A4A52;
    --move:#C98A1B;
    --act:#E0694B;
    --note:#7A8C92;
    --danger:#B8524A;
    --display:"Fraunces",Georgia,serif;
    --body:"Karla",-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 70px;}
  h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;}
  button{font:inherit;color:inherit;cursor:pointer;}
  input,select,textarea{font:inherit;}
  a{color:var(--accent);}
  [hidden]{display:none!important;}

  /* ---------- haus ---------- */
  header.hero{position:relative;padding:26px 0 18px;overflow:hidden;}
  header.hero .motif{position:absolute;right:-10px;top:0;height:100%;width:min(46%,320px);opacity:.9;pointer-events:none;}
  header.hero .motif svg{width:100%;height:100%;display:block;}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .eyebrow a{color:var(--accent);text-decoration:none;}
  .eyebrow a:hover{text-decoration:underline;}
  h1{font-size:clamp(30px,6vw,44px);font-weight:700;line-height:1;letter-spacing:-.02em;position:relative;max-width:70%;overflow-wrap:anywhere;}
  h1 small{display:block;font-family:var(--body);font-size:15px;font-weight:400;color:var(--dim);letter-spacing:0;margin-top:8px;}
  @media (max-width:560px){ h1{max-width:100%;} header.hero .motif{opacity:.35;} }
  .userbar{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dim);margin:14px 0 0;position:relative;flex-wrap:wrap;}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}

  .tabrow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin:0 0 18px;}
  nav.tabs{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0;flex:1;}
  .tabrow .btn{flex:0 0 auto;margin-left:auto;}
  @media (max-width:640px){ .tabrow .btn{display:none;} }
  @media (min-width:641px){ .fab{display:none;} }
  nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;color:var(--dim);font-weight:500;white-space:nowrap;}
  nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);}
  nav.tabs button .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--act);color:#fff;font-size:11px;font-weight:700;margin-left:4px;text-align:center;}

  /* ---------- spjöld og hnappar ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;}
  .card h2{font-size:20px;margin:0 0 6px;}
  .help{color:var(--dim);font-size:14px;margin:0;}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500;}
  .btn.ghost:hover{border-color:var(--dim);}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);font-weight:500;}
  .btn.small{padding:6px 10px;font-size:13px;border-radius:8px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .status{font-size:13px;color:var(--dim);min-height:1.3em;margin:8px 0 0;}
  .status.err{color:var(--danger);}
  .gbtn{display:flex;align-items:center;gap:10px;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-weight:500;width:100%;max-width:360px;}
  .gbtn:hover{border-color:var(--accent);}
  .glogo{width:18px;height:18px;border-radius:50%;background:conic-gradient(#4285F4 0 25%,#34A853 0 50%,#FBBC05 0 75%,#EA4335 0);flex:0 0 18px;}
  .notice{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin:0 0 14px;}
  .notice.warn{background:#FFF1D6;color:#5A3D07;}

  /* ---------- eyðublöð ---------- */
  .form{display:grid;gap:12px;grid-template-columns:1fr 1fr;}
  .form label{display:grid;gap:4px;font-size:13px;color:var(--dim);min-width:0;}
  .form label.full{grid-column:1 / -1;}
  .form input,.form select,.form textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:9px 11px;font-size:16px;}
  .form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .form .row{grid-column:1 / -1;}
  @media (max-width:560px){.form{grid-template-columns:1fr;}}
  .themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;grid-column:1 / -1;}
  .theme{border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--t-bg,#fff);color:var(--t-fg,#000);text-align:left;display:grid;gap:6px;}
  .theme[aria-pressed="true"]{border-color:var(--t-accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--t-accent) 30%,transparent);}
  .theme b{font-family:var(--display);font-size:15px;}
  .theme i{display:block;height:8px;border-radius:4px;background:var(--t-accent);}
  gmp-place-autocomplete{width:100%;display:block;--gmp-mat-color-surface:var(--panel-2);--gmp-mat-color-on-surface:var(--fg);}

  /* ---------- listar ---------- */
  .trips{list-style:none;margin:0;padding:0;display:grid;gap:8px;}
  .trips li{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--panel-2);border-radius:10px;padding:12px 14px;}
  .trips li a{color:var(--fg);text-decoration:none;font-weight:700;display:block;}
  .trips li small{color:var(--dim);display:block;}

  /* ---------- dagur fyrir dag ---------- */
  .days{display:grid;grid-template-columns:64px minmax(0,1fr) 180px;gap:14px 12px;align-items:start;}
  .days .date{position:sticky;top:0;align-self:start;text-align:center;padding:6px 0;}
  .days .date b{font-family:var(--display);font-size:26px;display:block;line-height:1;}
  .days .date span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:block;margin-top:4px;}
  .days .date.we b{color:var(--act);}
  .days .date.today b{color:var(--accent);}
  .items{display:grid;gap:8px;min-width:0;}
  .stay{grid-column:3;align-self:stretch;background:color-mix(in srgb,var(--hotel) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--hotel) 35%,var(--line));border-left:4px solid var(--hotel);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:3px;min-width:0;}
  .stay .kind{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--hotel);font-weight:700;}
  .stay b.name{font-weight:700;font-size:14px;overflow-wrap:anywhere;}
  .stay .d{color:var(--dim);overflow-wrap:anywhere;}
  .stay .full{display:contents;}
  .stay .short{display:none;}
  .stay{overflow:hidden;}
  .stay .acts{display:flex;flex-direction:column;gap:4px;margin-top:4px;align-items:flex-start;}
  .stayhead{grid-column:3;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:6px 0 0;}
  @media (max-width:640px){
    .days{grid-template-columns:50px minmax(0,1fr) 36px;gap:12px 8px;}
    .days .date b{font-size:22px;}
    .stay{padding:10px 0;align-items:center;cursor:pointer;border-left-width:3px;}
    .stay .full{display:none;}
    .stay .short{display:block;writing-mode:vertical-rl;text-orientation:mixed;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;max-height:100%;color:var(--hotel);}
    .stayhead{display:none;}
  }
  .item{display:grid;grid-template-columns:4px 1fr auto;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 0;overflow:hidden;min-width:0;}
  .item i.bar{display:block;border-radius:0 3px 3px 0;background:var(--c);}
  .item .main{min-width:0;}
  .item .kind{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);font-weight:700;}
  .item .title{font-weight:700;margin:2px 0;overflow-wrap:anywhere;}
  .item .meta{font-size:14px;color:var(--dim);overflow-wrap:anywhere;}
  .item .meta span+span::before{content:" · ";}
  .item .time{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap;text-align:right;font-size:14px;}
  .item .time small{display:block;color:var(--dim);font-weight:400;}

  .item .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;}
  .conf{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--panel-2);padding:1px 6px;border-radius:5px;}
  .maplink{font-size:13px;color:var(--accent);text-decoration:none;font-weight:500;}
  .maplink:hover{text-decoration:underline;}
  .linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:2px;}
  .empty{color:var(--dim);font-size:14px;padding:8px 0;margin:0;}
  .fab{position:fixed;right:16px;bottom:18px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:999px;padding:12px 18px;}

  /* ---------- dagatal ---------- */
  .months{display:grid;gap:22px;}
  .cal-head h3{font-size:20px;margin:0 0 8px;}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:0 0 3px;}
  .dow span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:center;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal .c{min-height:76px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;font-size:12px;min-width:0;cursor:pointer;}
  .cal .c.pad{background:transparent;border-color:transparent;cursor:default;}
  .cal .c.out{opacity:.35;}
  .cal .c .n{font-weight:700;font-size:13px;}
  .cal .c .n.we{color:var(--act);}
  .cal .stay{height:6px;border-radius:0;background:var(--hotel);margin:4px -5px 0 -5px;}
  .cal .stay.start{margin-left:4px;border-radius:3px 0 0 3px;}
  .cal .stay.end{margin-right:4px;border-radius:0 3px 3px 0;}
  .cal .stay.start.end{margin-inline:4px;border-radius:3px;}
  .cal .ev{display:flex;gap:4px;align-items:center;margin-top:3px;line-height:1.2;min-width:0;}
  .cal .ev i{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--c);}
  .cal .ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--dim);margin:12px 0 0;}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:-1px;}
  @media (max-width:560px){ .cal .c{min-height:58px;} .cal .ev span{display:none;} .cal .ev{margin-top:4px;} }

  /* ---------- kort ---------- */
  #gmap{width:100%;height:min(70vh,520px);border-radius:14px;border:1px solid var(--line);background:var(--panel-2);}
  .pinlist{display:grid;gap:4px;margin:12px 0 0;}
  .pin{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 8px;border-radius:8px;background:none;border:0;text-align:left;width:100%;}
  .pin:hover,.pin.on{background:var(--panel-2);}
  .pin i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:0 0 12px;}
  .pin b{font-weight:500;overflow-wrap:anywhere;}
  .pin small{color:var(--dim);margin-left:auto;white-space:nowrap;}

  /* ---------- gisting ---------- */
  .hotels{display:grid;gap:10px;}
  .hotel{display:grid;grid-template-columns:1fr auto;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--hotel);border-radius:12px;padding:12px 14px;}
  .hotel h3{font-size:18px;overflow-wrap:anywhere;}
  .hotel .nights{text-align:right;font-variant-numeric:tabular-nums;}
  .hotel .nights b{font-family:var(--display);font-size:26px;display:block;line-height:1;}
  .hotel .nights span{font-size:12px;color:var(--dim);}
  .hotel .io{font-size:14px;color:var(--dim);margin-top:4px;overflow-wrap:anywhere;}
  .hotel .io b{color:var(--fg);font-weight:500;}

  /* ---------- gluggi ---------- */
  dialog{border:0;border-radius:16px;padding:0;max-width:640px;width:calc(100% - 24px);background:var(--panel);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.3);}
  dialog::backdrop{background:rgba(20,30,34,.45);}
  dialog .inner{padding:18px;max-height:85vh;overflow:auto;}
  dialog h2{font-size:22px;margin:0 0 12px;}
  .share-box{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--panel-2);padding:8px 10px;border-radius:8px;overflow-wrap:anywhere;margin:6px 0 8px;}

  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:999px;padding:9px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:20;}
  .toast.show{opacity:1;}
  .foot{color:var(--dim);font-size:13px;margin:26px 0 0;}
  .viewseg{display:flex;justify-content:flex-end;margin:0 0 12px;}
  .pack{display:grid;gap:14px;}
  .pack .cat h3{font-size:16px;margin:0 0 6px;font-family:var(--display);}
  .pack .pi{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);}
  .pack .pi input[type=checkbox]{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:0 0 20px;}
  .pack .pi label{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer;}
  .pack .pi.done label{text-decoration:line-through;color:var(--dim);}
  .pack .pi small{color:var(--dim);margin-left:6px;}
  .pack .pi .x{background:none;border:0;color:var(--dim);font-size:18px;line-height:1;padding:0 4px;cursor:pointer;}
  .pack .pi .x:hover{color:var(--danger);}
  .progress{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin:6px 0 0;}
  .progress i{display:block;height:100%;background:var(--accent);}
  .clock{display:inline-flex;gap:14px;font-size:13px;color:var(--dim);margin-left:12px;font-variant-numeric:tabular-nums;}
  .clock b{color:var(--fg);font-weight:700;}
  #print{display:none;}
  @media print{
    body{background:#fff;color:#000;padding:0;}
    .wrap,.toast,dialog,.fab{display:none!important;}
    #print{display:block;font-family:Georgia,serif;font-size:12pt;color:#000;max-width:none;padding:0;}
    #print h1{font-size:22pt;margin:0 0 4pt;}
    #print h2{font-size:14pt;margin:16pt 0 6pt;border-bottom:1px solid #000;padding-bottom:2pt;}
    #print .pday{margin:0 0 8pt;page-break-inside:avoid;}
    #print .pday h3{font-size:12pt;margin:0 0 2pt;}
    #print .pit{margin:0 0 3pt 14pt;}
    #print .pit small{color:#444;}
    #print table{border-collapse:collapse;width:100%;}
    #print td,#print th{border-bottom:1px solid #999;padding:3pt 6pt;text-align:left;vertical-align:top;font-size:11pt;}
    #print .pnote{color:#444;font-size:10pt;margin:12pt 0 0;}
  }
  .faq details{border-bottom:1px solid var(--line);padding:8px 0;}
  .faq summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;}
  .faq summary::-webkit-details-marker{display:none;}
  .faq summary::after{content:"+";color:var(--dim);font-weight:400;}
  .faq details[open] summary::after{content:"−";}
  .faq p{margin:8px 0 0;color:var(--dim);font-size:14px;white-space:pre-line;}
  .offline{background:#FFF1D6;color:#5A3D07;border-radius:10px;padding:8px 14px;font-size:13px;margin:0 0 12px;}
  .item.next{box-shadow:0 0 0 2px var(--accent);}
  .countdown{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;margin-left:6px;vertical-align:middle;font-family:var(--body);}
  .info-view{display:grid;gap:0;}
  .info-view .kv{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);}
  .info-view .kv b{font-weight:700;}
  .info-view .kv span{white-space:pre-line;overflow-wrap:anywhere;}
  @media (max-width:560px){ .info-view .kv{grid-template-columns:1fr;gap:4px;} }
  .support{color:var(--dim);font-size:13px;margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);}
  .support b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums;}
  .idea{display:grid;grid-template-columns:1fr auto;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .idea h3{font-size:17px;overflow-wrap:anywhere;}
  .idea .by{font-size:12px;color:var(--dim);}
  .idea.done{opacity:.6;}
  .tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="motif" id="motif" aria-hidden="true"></div>
    <p class="eyebrow" id="eyebrow"><a href="/travel/">Travel</a></p>
    <h1 id="title">Travel<small>Allt sem er bókað, á einum stað.</small></h1>
    <div class="userbar" id="userbar"></div>
  </header>
  <div class="tabrow" id="tabrow" hidden><nav class="tabs" id="tabs" role="tablist"></nav><button class="btn small" id="addTop" type="button" hidden></button></div>
  <main id="app"></main>
  <p class="foot" id="foot"></p>
  <p class="support">Ég smíðaði þessa síðu fyrir mig og vini mína og deili henni með þér. Ef hún sparar þér tíma, þá er kaffibolli vel þeginn. Reikningur <b>0527-26-1416</b>, kt. <b>471025-0380</b>.</p>
</div>
<dialog id="dlg"><div class="inner" id="dlgInner"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="print" aria-hidden="true"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
/* ==================================================================
   STILLINGAR. Tvennt þarf að líma inn:
   1) FIREBASE_CONFIG: Firebase console > Project settings > Your apps > Web app > "Config".
      Gögnin og hittumst eru í sama verkefni (min-timer-multabeneis).

const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const k in attrs){
    if (k === 'class') n.className = attrs[k];
    else if (k === 'html') n.innerHTML = attrs[k];
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] === false || attrs[k] == null) {}
    else n.setAttribute(k, attrs[k]);
  }
  for (const kid of kids){ if (kid != null) n.append(kid); }
  return n;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const MONTH = ['janúar','febrúar','mars','apríl','maí','júní','júlí','ágúst','september','október','nóvember','desember'];
const MONTH_S = ['jan','feb','mar','apr','maí','jún','júl','ágú','sep','okt','nóv','des'];
const DOW = ['mán','þri','mið','fim','fös','lau','sun'];
const dpart = s => (s || '').slice(0,10);
const tpart = s => (s || '').slice(11,16);
const parse = s => { const [y,m,d] = dpart(s).split('-').map(Number); return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dow = d => (d.getDay()+6)%7;

const fmtRange = (a,b) => { const A = parse(a), B = parse(b); return `${A.getDate()}. ${MONTH_S[A.getMonth()]}${A.getFullYear() !== B.getFullYear() ? ' ' + A.getFullYear() : ''} til ${B.getDate()}. ${MONTH_S[B.getMonth()]} ${B.getFullYear()}`; };
const ALPHA = 'abcdefghjkmnpqrstuvwxyz23456789';

/* Les hnit úr Google Maps hlekk: .../@21.1,-86.8,15z  eða  ?q=21.1,-86.8  eða  !3d21.1!4d-86.8 */
function coordsFromLink(s){
  if (!s) return null;
  let m = s.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/) || s.match(/[?&]q=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/) || s.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/) || s.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
  return m ? { lat: +m[1], lng: +m[2] } : null;
}

  async function saveTrip(){
    st.className = 'status';
    const t = title.value.trim(), s = start.value, e = end.value;
    if (!t || !s || !e){ st.textContent = 'Heiti og báðar dagsetningar þarf.'; st.classList.add('err'); return; }
    if (e < s){ st.textContent = 'Síðasti dagur er á undan þeim fyrsta.'; st.classList.add('err'); return; }

    try {
      if (isNew){
        const id = rnd(10);
        const data = { owner: user.uid, title: t, start: s, end: e, description: desc.value.trim(), theme, tz: tzSel.value || null, created: new Date().toISOString() };

      await db.ref().update({ [`travel/trips/${cur.id}`]: null, [`travel/private/${cur.id}`]: null, [`travel/users/${user.uid}/trips/${cur.id}`]: null });
      toast('Ferð eytt'); location.hash = '';
    } catch(err){ toast('Tókst ekki að eyða: ' + (err.code || '')); }
  }
  return card;
}

/* ==================================================================
   FERÐ
   ================================================================== */
let cur = null;       /* { id, trip, items:[], suggestions:{}, ref, tab } */
let map = null, markers = [], infoWin = null;

function stopTrip(){
  if (cur && cur.ref) cur.ref.off();
  if (cur && cur.privRef) cur.privRef.off();
  if (myTripsRef){ myTripsRef.off(); myTripsRef = null; }
  cur = null; map = null; markers = [];
}
function isOwner(){ return !!(user && cur && cur.trip && cur.trip.owner === user.uid); }

/* Síðasta útgáfa ferðar er geymd í símanum svo hún opnist án nets */
function cacheTrip(){
  if (!cur || !cur.trip) return;
  store.set(`travel:cache:${cur.id}`, { trip: cur.trip, priv: isOwner() ? cur.priv : {}, uid: isOwner() ? user.uid : null, savedAt: new Date().toISOString() });
}
function applyTripData(v){
  cur.trip = v;
  cur.items = Object.entries(v.items || {}).map(([id, it]) => ({ id, ...it, conf: (cur.priv[id] && cur.priv[id].conf) || it.conf || null, price: (cur.priv[id] && cur.priv[id].price) || it.price || null })).sort((a,b) => (a.start || '').localeCompare(b.start || ''));
  cur.suggestions = v.suggestions || {};
  cur.ideas = Object.entries(v.ideas || {}).map(([id, x]) => ({ id, ...x })).sort((a,b) => (a.created || '').localeCompare(b.created || ''));
  cur.packing = Object.entries(v.packing || {}).map(([id, x]) => ({ id, ...x })).sort((a,b) => (a.created || '').localeCompare(b.created || ''));
}
function openTrip(r){
  if (cur && cur.id === r.id){ cur.tab = r.tab || cur.tab; renderTrip(); return; }
  stopTrip();
  store.set('travel:last', r.id);
  cur = { id: r.id, trip: null, items: [], suggestions: {}, ideas: [], packing: [], priv: {}, privRef: null, ref: db.ref(`travel/trips/${r.id}`), tab: r.tab || store.get('travel:tab', 'dagar'), fromCache: false, live: false };
  $('#app').innerHTML = '<p class="empty">Sæki ferðina…</p>';
  setHeader('Sæki…', '');
  const cached = store.get(`travel:cache:${r.id}`, null);
  if (cached && cached.trip){
    /* einkagögn úr geymslu aðeins ef sami notandi er innskráður */
    cur.priv = (cached.uid && user && cached.uid === user.uid) ? (cached.priv || {}) : {};
    cur.fromCache = true; cur.cachedAt = cached.savedAt;
    applyTripData(cached.trip);
    renderTrip();
  }
  cur.ref.on('value', snap => {
    const v = snap.val();
    if (!v){ renderMissing(); return; }
    cur.fromCache = false; cur.live = true;
    cur.trip = v;
    cur.items = Object.entries(v.items || {}).map(([id, it]) => ({ id, ...it, conf: (cur.priv[id] && cur.priv[id].conf) || it.conf || null, price: (cur.priv[id] && cur.priv[id].price) || it.price || null })).sort((a,b) => (a.start || '').localeCompare(b.start || ''));
    watchPrivate();
    cur.suggestions = v.suggestions || {};
    cur.ideas = Object.entries(v.ideas || {}).map(([id, x]) => ({ id, ...x })).sort((a,b) => (a.created || '').localeCompare(b.created || ''));
    cur.packing = Object.entries(v.packing || {}).map(([id, x]) => ({ id, ...x })).sort((a,b) => (a.created || '').localeCompare(b.created || ''));
    if (isOwner() && cur.privOk) migrateConf();
    cacheTrip();
    renderTrip();
  }, err => {
    $('#app').innerHTML = `<div class="card"><p style="margin:0 0 12px">Náði ekki í ferðina. ${err && err.code === 'PERMISSION_DENIED' ? 'Reglurnar fyrir /travel vantar í Firebase.' : ''}</p><a class="btn" href="/travel/" style="text-decoration:none;display:inline-block">Á forsíðu</a></div>`;
  });
}
/* Bókunarnúmer eru geymd í travel/private/{tid}, sem aðeins eigandi má lesa.
   Eigandi fær þau hér og þau renna saman við færslurnar. Gestir sjá þau aldrei. */
function watchPrivate(){
  if (!cur || cur.privRef || !isOwner()) return;
  cur.privRef = db.ref(`travel/private/${cur.id}`);
  cur.privRef.on('value', snap => {
    if (!cur) return;
    cur.priv = snap.val() || {};
    cur.privOk = true;
    cur.items = cur.items.map(it => ({ ...it, conf: (cur.priv[it.id] && cur.priv[it.id].conf) || it.conf || null, price: (cur.priv[it.id] && cur.priv[it.id].price) || it.price || null }));
    migrateConf();
    cacheTrip();
    renderTrip();
  }, err => {
    cur.privOk = false;
    cur.privErr = err && (err.code || err.message) || 'óþekkt villa';
    renderTrip();
  });
}
/* Eldri færslur með bókunarnúmer í opna hlutanum: færa í einkahólfið, einu sinni */
let migrating = false;
async function migrateConf(){
  if (migrating || !isOwner() || !cur.trip) return;
  const upd = {};
  for (const [id, it] of Object.entries(cur.trip.items || {})){
    if (it && it.conf){ upd[`travel/private/${cur.id}/${id}/conf`] = it.conf; upd[`travel/trips/${cur.id}/items/${id}/conf`] = null; }
    if (it && it.price){ upd[`travel/private/${cur.id}/${id}/price`] = it.price; upd[`travel/trips/${cur.id}/items/${id}/price`] = null; }
  }
  if (!Object.keys(upd).length) return;
  migrating = true;
  try { await db.ref().update(upd); toast('Bókunarnúmer og verð færð í einkahólf'); }
  catch(e){ toast('Náði ekki að færa bókunarnúmer í einkahólf: ' + (e.code || e.message)); }
  finally { migrating = false; }
}
function renderMissing(){
  stopTrip(); $('#tabrow').hidden = true;
  setHeader('Úps', '');
  $('#app').innerHTML = `<div class="card"><p style="margin:0 0 12px">Þessi ferð finnst ekki. Kannski var henni eytt, eða hlekkurinn er rangur.</p><a class="btn" href="/travel/" style="text-decoration:none;display:inline-block">Á forsíðu</a></div>`;
}

function renderTrip(){
  const { trip } = cur; if (!trip) return;
  applyTheme(trip.theme);
  const nights = Math.max(0, Math.round((parse(trip.end) - parse(trip.start)) / 86400000));
  const hotels = cur.items.filter(i => i.kind === 'hotel').length;
  setHeader(trip.title, `${fmtRange(trip.start, trip.end)} · ${nights} ${nights === 1 ? 'nótt' : 'nætur'}${hotels ? ` · ${hotels} ${hotels === 1 ? 'gisting' : 'gistingar'}` : ''}`, isOwner() ? 'þín ferð' : 'gestur');
  /* Niðurtalning eða staða ferðar í haus */
  const today = todayIso();
  const daysTo = Math.round((parse(trip.start) - parse(today)) / 86400000);
  const dayNo = Math.round((parse(today) - parse(trip.start)) / 86400000) + 1;
  const total = Math.round((parse(trip.end) - parse(trip.start)) / 86400000) + 1;
  let cd = '';
  if (daysTo > 0) cd = daysTo === 1 ? 'Á morgun' : `Eftir ${daysTo} daga`;
  else if (today <= trip.end) cd = `Dagur ${dayNo} af ${total}`;
  else cd = 'Lokið';
  $('#title').append(el('span', {class:'countdown'}, cd));
  renderUserbar();
  renderClock();

  const owner = isOwner();
  const nSug = Object.keys(cur.suggestions).length;
  const nIdeas = cur.ideas.filter(i => !i.scheduled).length;
  if (cur.tab === 'dagatal'){ cur.tab = 'dagar'; store.set('travel:dagview', 'cal'); }
  const nPack = cur.packing.length, nPackDone = cur.packing.filter(x => x.done).length;
  const tabs = [['dagar','Dagskrá'],['kort','Kort'],['gisting','Gisting'],['hugmyndir','Hugmyndabanki' + (nIdeas ? ` <span style="color:var(--dim);font-weight:400">${nIdeas}</span>` : '')],['pokkun','Pökkun' + (nPack ? ` <span style="color:var(--dim);font-weight:400">${nPackDone}/${nPack}</span>` : '')]];
  if (owner) tabs.push(['mikilvaegt', 'Mikilvægt']);
  if (owner) tabs.push(['stillingar', 'Stillingar' + (nSug ? `<span class="n">${nSug}</span>` : '')]);
  if (!tabs.some(t => t[0] === cur.tab)) cur.tab = 'dagar';
  $('#tabrow').hidden = false;
  const nav = $('#tabs'); nav.innerHTML = '';
  for (const [k, label] of tabs){
    nav.append(el('button', {role:'tab', 'aria-selected': String(cur.tab === k), html: label, onclick: () => { cur.tab = k; store.set('travel:tab', k); history.replaceState(null, '', `#t/${cur.id}/${k}`); renderTrip(); }}));
  }

  const app = $('#app'); app.innerHTML = '';
  if (!navigator.onLine || (cur.fromCache && !cur.live)){
    const when = cur.cachedAt ? new Date(cur.cachedAt) : null;
    app.append(el('div', {class:'offline'}, (!navigator.onLine ? 'Án nets. ' : '') + (cur.fromCache ? `Sýni útgáfuna sem var vistuð í símanum${when ? ' ' + when.getDate() + '. ' + MONTH_S[when.getMonth()] + ' kl. ' + pad(when.getHours()) + ':' + pad(when.getMinutes()) : ''}. Breytingar vistast ekki fyrr en net næst.` : 'Breytingar vistast þegar net næst.')));
  }
  if (trip.description && cur.tab === 'dagar') app.append(el('p', {class:'help', style:'margin:0 0 14px;white-space:pre-line'}, trip.description));
  if (owner && cur.privOk === false){
    app.append(el('div', {class:'notice warn', html:`<b>Einkahólf fyrir bókunarnúmer er lokað</b> (${esc(cur.privErr || '')}). Reglan "private" vantar líklega í Firebase. Límdu nýjustu reglurnar inn í Firebase console og endurhladdu.`}));
  }
  if (owner && nSug && cur.tab !== 'stillingar'){
    app.append(el('div', {class:'notice', html:`<b>${nSug} ${nSug === 1 ? 'tillaga bíður' : 'tillögur bíða'} samþykkis.</b> <button class="linkbtn" type="button" id="goSug">Skoða</button>`}));
    $('#goSug').onclick = () => { cur.tab = 'stillingar'; renderTrip(); };
  }
  if (cur.tab === 'dagar'){
    const view = store.get('travel:dagview', 'list');
    const seg = el('div', {class:'viewseg'}, el('div', {class:'seg'},
      el('button', {type:'button', 'aria-pressed': String(view === 'list'), onclick: () => { store.set('travel:dagview', 'list'); renderTrip(); }}, 'Dagur fyrir dag'),
      el('button', {type:'button', 'aria-pressed': String(view === 'cal'), onclick: () => { store.set('travel:dagview', 'cal'); renderTrip(); }}, 'Dagatal')));
    app.append(seg);
    if (view === 'cal'){ renderCal(app); }
    else renderDays(app);
    /* Fyrsta skipti sem ferð í gangi opnast: skruna að deginum í dag */
    if (!cur.scrolled && today >= trip.start && today <= trip.end){
      cur.scrolled = true;
      const t = $('#day-today'); if (t) setTimeout(() => t.scrollIntoView({ block:'start', behavior:'smooth' }), 50);
    }
  }
  else if (cur.tab === 'kort') renderMap(app);
  else if (cur.tab === 'gisting') renderHotels(app);
  else if (cur.tab === 'hugmyndir') renderIdeas(app);
  else if (cur.tab === 'mikilvaegt') renderInfo(app);
  else if (cur.tab === 'pokkun') renderPacking(app);
  else if (cur.tab === 'stillingar') renderSettings(app);

  /* Hnappur til að bæta við: í flipalínunni á tölvu, fljótandi neðst í síma */
  const old = $('#fab'); if (old) old.remove();
  const top = $('#addTop');
  let addLabel = null, addFn = null;
  if (cur.tab === 'hugmyndir'){ addLabel = '+ Hugmynd'; addFn = () => openIdeaDialog(); }
  else if (cur.tab === 'pokkun'){ addLabel = '+ Pökkun'; addFn = () => openPackDialog(); }
  else if (cur.tab !== 'stillingar' && cur.tab !== 'mikilvaegt'){
    if (owner){ addLabel = '+ Bæta við'; addFn = () => openItemDialog(null); }
    else { addLabel = '+ Senda tillögu'; addFn = () => openItemDialog(null, true); }
  }
  top.hidden = !addLabel;
  if (addLabel){
    top.textContent = addLabel; top.onclick = addFn;
    document.body.append(el('button', {class:'btn fab', id:'fab', type:'button', onclick: addFn}, addLabel));
  }
  $('#foot').innerHTML = (owner ? `Hver sem hefur hlekkinn getur skoðað ferðina, sent tillögu og bætt í hugmyndabankann. Aðeins þú breytir áætluninni. <button class="linkbtn" id="copyShare">Afrita hlekk</button>` : `Þú skoðar þessa ferð sem gestur. Þú getur sent tillögu að færslu sem eigandi samþykkir. <button class="linkbtn" id="sugBtn">Senda tillögu</button>`) + ` · <button class="linkbtn" id="icsBtn">Sækja í dagatal símans</button>`;
  $('#foot').innerHTML += ` · <button class="linkbtn" id="printBtn">Prenta</button> · <button class="linkbtn" id="helpBtn">Hjálp</button>`;
  $('#printBtn').onclick = printTrip;
  const cs = $('#copyShare'); if (cs) cs.onclick = () => copy(`${BASE}#t/${cur.id}`, 'Hlekkur afritaður');
  const sb = $('#sugBtn'); if (sb) sb.onclick = () => openItemDialog(null, true);
  $('#helpBtn').onclick = openHelp;
  $('#icsBtn').onclick = exportIcs;
}

/* ---------- dagur fyrir dag ---------- */
function allDays(){
  const out = []; const d = parse(cur.trip.start), end = parse(cur.trip.end);
  let guard = 0;
  while (d <= end && guard++ < 400){ out.push(iso(d)); d.setDate(d.getDate()+1); }
  return out;
}
const stayOn = day => cur.items.find(i => i.kind === 'hotel' && dpart(i.start) <= day && dpart(i.end) > day);

function renderDays(host){
  const days = allDays();
  const grid = el('div', {class:'days'});
  const today = todayIso();
  const stays = cur.items.filter(i => i.kind === 'hotel');
  const outside = cur.items.filter(i => i.kind !== 'hotel' && (dpart(i.start) < cur.trip.start || dpart(i.start) > cur.trip.end));
  if (!cur.items.length) host.append(el('p', {class:'empty'}, isOwner() ? 'Engin færsla enn. Smelltu á "Bæta við" til að skrá fyrsta flugið eða hótelið.' : 'Engin færsla enn.'));
  const placed = new Set();
  days.forEach((day, idx) => {
    const row = idx + 1;
    const d = parse(day);
    grid.append(el('div', {class:'date' + (dow(d) > 4 ? ' we' : '') + (day === today ? ' today' : ''), id: day === today ? 'day-today' : null, style:`grid-row:${row}`, html:`<b>${d.getDate()}</b><span>${day === today ? 'í dag' : DOW[dow(d)] + ' ' + MONTH_S[d.getMonth()]}</span>`}));
    const todays = cur.items.filter(i => i.kind !== 'hotel' && dpart(i.start) === day).sort((a,b) => a.start.localeCompare(b.start));
    const items = el('div', {class:'items', style:`grid-row:${row}`});
    if (!todays.length) items.append(el('p', {class:'empty'}, 'Frjáls dagur.'));
    const nowStr = day === today ? `${day}T${pad(new Date().getHours())}:${pad(new Date().getMinutes())}` : null;
    let nextMarked = false;
    for (const it of todays){
      const card = itemCard(it);
      if (nowStr && !nextMarked && (it.end || it.start) >= nowStr){ card.classList.add('next'); nextMarked = true; }
      items.append(card);
    }
    grid.append(items);
    /* Gisting sem rönd í þriðja dálki yfir næturnar */
    for (const h of stays){
      if (placed.has(h.id)) continue;
      const hs = dpart(h.start), he = dpart(h.end || h.start);
      if (hs === day || (hs < day && he > day)){
        let n = 0; while (idx + n < days.length && days[idx + n] < he) n++;
        if (n === 0) n = 1;
        placed.add(h.id);
        grid.append(stayCell(h, row, n));
      }
    }
  });
  const unplaced = stays.filter(h => !placed.has(h.id));
  host.append(grid);
  if (outside.length || unplaced.length){
    const wrap = el('div', {class:'card', style:'margin-top:16px'}, el('h2', {style:'font-size:17px'}, 'Utan ferðatímabils'));
    const items = el('div', {class:'items'});
    for (const it of outside.concat(unplaced)) items.append(itemCard(it));
    wrap.append(items); host.append(wrap);
  }
}
function stayCell(h, row, n){
  const link = gmapsLink(h);
  const c = el('div', {class:'stay', style:`grid-row:${row} / span ${n}`, title: h.title});
  const full = el('div', {class:'full'});
  full.append(el('span', {class:'kind'}, 'Gisting'), el('b', {class:'name'}, h.title),
    el('span', {class:'d'}, `${n} ${n === 1 ? 'nótt' : 'nætur'}`),
    el('span', {class:'d'}, `Inn ${fmtD(h.start)}${tpart(h.start) ? ' kl. ' + tpart(h.start) : ''}`),
    el('span', {class:'d'}, h.end ? `Út ${fmtD(h.end)}${tpart(h.end) ? ' kl. ' + tpart(h.end) : ''}` : ''));
  if (h.place) full.append(el('span', {class:'d'}, h.place));
  if (h.conf) full.append(el('span', {class:'conf', style:'align-self:flex-start'}, h.conf));
  if (h.note) full.append(el('span', {class:'d', style:'white-space:pre-line'}, h.note));
  const acts = el('div', {class:'acts'});
  if (link) acts.append(el('a', {class:'maplink', href:link, target:'_blank', rel:'noopener'}, 'Opna í Google Maps ↗'));
  if (h.url) acts.append(el('a', {class:'maplink', href:h.url, target:'_blank', rel:'noopener'}, 'Bókun ↗'));
  if (isOwner()) acts.append(el('button', {class:'linkbtn', type:'button', onclick: () => openItemDialog(h)}, 'Breyta'));
  full.append(acts);
  c.append(full, el('span', {class:'short'}, h.title));
  c.addEventListener('click', e => {
    if (e.target.closest('a,button')) return;
    if (window.matchMedia('(max-width:640px)').matches){ cur.tab = 'gisting'; store.set('travel:tab','gisting'); renderTrip(); }
  });
  return c;
}
function itemCard(it, asNight){
  const k = kindOf(it.kind);
  const card = el('div', {class:'item' + (asNight ? ' night' : ''), style:`--c:${k.c}`});
  let time;
  if (asNight) time = `<span class="time">Gisting<small>nótt</small></span>`;
  else if (it.kind === 'hotel') time = `<span class="time">${esc(tpart(it.start)) || ''}<small>innritun</small></span>`;
  else {
    const sameDay = dpart(it.end) === dpart(it.start) || !it.end;
    time = `<span class="time">${esc(tpart(it.start))}<small>${it.end ? 'til ' + (sameDay ? '' : parse(it.end).getDate() + '. ' + MONTH_S[parse(it.end).getMonth()] + ' ') + esc(tpart(it.end)) : ''}</small></span>`;
  }
  const meta = [it.flightNo ? `<span class="conf">${esc(it.flightNo)}</span>` : '', it.place ? esc(it.place) : '', it.conf ? `<span class="conf">${esc(it.conf)}</span>` : '', it.price ? esc(it.price) : ''].filter(Boolean).map(s => `<span>${s}</span>`).join('');
  const link = gmapsLink(it);
  if (it.flightNo) card.dataset.flight = it.flightNo;
  if (asNight){
    card.innerHTML = `<i class="bar"></i><div class="main"><div class="kind">Gisting</div><div class="title" style="font-weight:500">${esc(it.title)}</div></div>${time}`;
    return card;
  }
  card.innerHTML = `<i class="bar"></i><div class="main"><div class="kind">${k.label}</div><div class="title">${esc(it.title)}</div>${meta ? `<div class="meta">${meta}</div>` : ''}${it.note ? `<div class="meta" style="margin-top:4px;white-space:pre-line">${esc(it.note)}</div>` : ''}<div class="acts"></div></div>${time}`;
  const acts = card.querySelector('.acts');
  if (link) acts.append(el('a', {class:'maplink', href:link, target:'_blank', rel:'noopener'}, 'Opna í Google Maps ↗'));
  const dir = dirLink(it);
  if (dir) acts.append(el('a', {class:'maplink', href:dir, target:'_blank', rel:'noopener'}, 'Leið frá hótelinu ↗'));
  if (it.flightNo) acts.append(el('a', {class:'maplink', href:`https://www.flightradar24.com/data/flights/${encodeURIComponent(it.flightNo.replace(/\s+/g,'').toLowerCase())}`, target:'_blank', rel:'noopener'}, 'Staða flugs ↗'));
  if (it.url) acts.append(el('a', {class:'maplink', href:it.url, target:'_blank', rel:'noopener'}, 'Bókun ↗'));
  if (isOwner() && !asNight) acts.append(el('button', {class:'linkbtn', type:'button', onclick: () => openItemDialog(it)}, 'Breyta'));
  return card;
}

/* ---------- dagatal ---------- */
function renderCal(host){
  const months = el('div', {class:'months'});
  const s = parse(cur.trip.start), e = parse(cur.trip.end);
  const list = []; let y = s.getFullYear(), m = s.getMonth();
  while (y < e.getFullYear() || (y === e.getFullYear() && m <= e.getMonth())){ list.push([y,m]); m++; if (m > 11){ m = 0; y++; } if (list.length > 24) break; }
  for (const [yy,mm] of list){
    const sec = el('div');
    sec.innerHTML = `<div class="cal-head"><h3>${MONTH[mm][0].toUpperCase()+MONTH[mm].slice(1)} ${yy}</h3></div><div class="dow">${DOW.map(d => `<span>${d}</span>`).join('')}</div><div class="cal"></div>`;
    const cal = sec.querySelector('.cal');
    for (let i = 0; i < dow(new Date(yy,mm,1)); i++) cal.append(el('div', {class:'c pad'}));
    const days = new Date(yy,mm+1,0).getDate();
    for (let d = 1; d <= days; d++){
      const key = iso(new Date(yy,mm,d));
      const inTrip = key >= cur.trip.start && key <= cur.trip.end;
      const c = el('div', {class:'c' + (inTrip ? '' : ' out'), onclick: () => { if (!inTrip) return; store.set('travel:dagview', 'list'); cur.tab = 'dagar'; renderTrip(); } });
      let html = `<div class="n${dow(new Date(yy,mm,d)) > 4 ? ' we' : ''}">${d}</div>`;
      const stay = stayOn(key);
      if (stay){
        const start = dpart(stay.start) === key;
        const end = iso(new Date(parse(stay.end).getTime() - 86400000)) === key;
        html += `<div class="stay${start ? ' start' : ''}${end ? ' end' : ''}" title="${esc(stay.title)}"></div>`;
      }
      for (const it of cur.items.filter(i => dpart(i.start) === key && i.kind !== 'hotel')){
        html += `<div class="ev" style="--c:${kindOf(it.kind).c}" title="${esc(it.title)}"><i></i><span>${esc(it.title)}</span></div>`;
      }
      c.innerHTML = html; cal.append(c);
    }
    months.append(sec);
  }
  host.append(months);

/* ---------- kort ---------- */
let mapsLoading = null;
function loadMaps(){
  if (window.google && google.maps) return Promise.resolve();
  if (mapsLoading) return mapsLoading;
  mapsLoading = new Promise((res, rej) => {
    window.__mapsReady = () => res();
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(MAPS_KEY)}&libraries=places,marker&language=is&region=IS&loading=async&callback=__mapsReady`;
    s.onerror = () => rej(new Error('maps'));
    document.head.append(s);
  });
  return mapsLoading;
}
const pinned = () => cur.items.filter(i => i.lat != null && i.lng != null);
function renderMap(host){
  if (!MAPS_READY){
    host.append(el('div', {class:'notice warn', html:'<b>Google Maps er ekki stillt enn.</b> Google Maps lykilinn vantar í kóðann. Hlekkurinn "Opna í Google Maps" á hverri færslu virkar samt.'}));
  } else {
    host.append(el('div', {id:'gmap'}));
  }
  const pts = pinned();
  const list = el('div', {class:'pinlist'});
  if (!pts.length) list.append(el('p', {class:'empty'}, 'Engin færsla með staðsetningu enn. Veldu stað úr leitinni þegar þú skráir færslu, eða límdu Google Maps hlekk.'));
  pts.forEach((it, i) => {
    const d = parse(it.start);
    list.append(el('button', {type:'button', class:'pin', id:'pin-'+it.id, style:`--c:${kindOf(it.kind).c}`, html:`<i></i><b>${esc(it.title)}</b><small>${d.getDate()}. ${MONTH_S[d.getMonth()]}</small>`, onclick: () => focusPin(it.id)}));
  });
  host.append(list);
  if (!MAPS_READY) return;
  loadMaps().then(() => {
    const elMap = $('#gmap'); if (!elMap) return;
    map = new google.maps.Map(elMap, { center: { lat: 64.1, lng: -21.9 }, zoom: 5, mapTypeControl: false, streetViewControl: false, fullscreenControl: true });
    infoWin = new google.maps.InfoWindow();
    markers = [];
    const bounds = new google.maps.LatLngBounds();
    const colors = { hotel:'#4F5BD5', flight:'#3A4A52', move:'#C98A1B', act:'#E0694B', note:'#7A8C92' };
    for (const it of pts){
      const pos = { lat: +it.lat, lng: +it.lng };
      const mk = new google.maps.Marker({ position: pos, map, title: it.title,
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 9, fillColor: colors[it.kind] || colors.note, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 } });
      mk.addListener('click', () => focusPin(it.id));
      markers.push({ id: it.id, mk, it }); bounds.extend(pos);
    }
    if (pts.length === 1) { map.setCenter(bounds.getCenter()); map.setZoom(13); }
    else if (pts.length > 1) map.fitBounds(bounds, 40);
  }).catch(() => toast('Google Maps hlaðst ekki. Athugaðu lykilinn.'));
}
function focusPin(id){
  document.querySelectorAll('.pin').forEach(p => p.classList.toggle('on', p.id === 'pin-' + id));
  const m = markers.find(x => x.id === id);
  if (m && map){
    map.panTo(m.mk.getPosition()); if (map.getZoom() < 12) map.setZoom(13);
    const it = m.it; const link = gmapsLink(it);
    infoWin.setContent(`<div style="font-family:Karla,sans-serif;max-width:220px"><b>${esc(it.title)}</b><br><span style="color:#666">${fmtD(it.start)}${tpart(it.start) ? ' kl. ' + esc(tpart(it.start)) : ''}</span>${it.place ? `<br>${esc(it.place)}` : ''}${link ? `<br><a href="${link}" target="_blank" rel="noopener">Opna í Google Maps</a>` : ''}</div>`);
    infoWin.open({ map, anchor: m.mk });
  } else {
    const it = cur.items.find(i => i.id === id); if (it) toast(`${it.title}${it.place ? ' · ' + it.place : ''}`);

}

/* ---------- útflutningur í dagatal (ics) ----------
   Tímar eru "fljótandi", án tímabeltis: 10:00 í Mexíkó birtist sem 10:00
   í síma sem er stilltur á Mexíkótíma. Gisting er heilsdagsviðburður. */
function icsEscape(s){ return String(s ?? '').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){ const out = []; let i = 0; while (i < line.length){ out.push((i ? ' ' : '') + line.slice(i, i + (i ? 74 : 75))); i += i ? 74 : 75; } return out.join('\r\n'); }
const icsDT = s => s.replace(/[-:]/g, '').slice(0, 15) + (s.length > 10 ? '00' : '');
function buildIcs(){
  const { trip } = cur;
  const stamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15) + 'Z';
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//multabene.is//travel//IS','CALSCALE:GREGORIAN','METHOD:PUBLISH', 'X-WR-CALNAME:' + icsEscape(trip.title)];
  for (const it of cur.items){
    if (!it.start) continue;
    const k = kindOf(it.kind);
    const desc = [it.conf ? 'Bókunarnúmer: ' + it.conf : '', it.flightNo ? 'Flug: ' + it.flightNo : '', it.price ? 'Verð: ' + it.price : '', it.note || '', it.url || '', gmapsLink(it) || ''].filter(Boolean).join('\n');
    lines.push('BEGIN:VEVENT', 'UID:' + it.id + '@multabene.is/travel/' + cur.id, 'DTSTAMP:' + stamp, 'SUMMARY:' + icsEscape((it.kind === 'hotel' ? 'Gisting: ' : '') + it.title));
    if (it.kind === 'hotel'){
      const endDate = dpart(it.end || it.start) > dpart(it.start) ? dpart(it.end) : iso(new Date(parse(it.start).getTime() + 86400000));
      lines.push('DTSTART;VALUE=DATE:' + dpart(it.start).replace(/-/g,''), 'DTEND;VALUE=DATE:' + endDate.replace(/-/g,''));
    } else {
      const st = it.start.length > 10 ? it.start : it.start + 'T09:00';
      const en = it.end ? (it.end.length > 10 ? it.end : it.end + 'T10:00') : st.slice(0,11) + pad(Math.min(23, +st.slice(11,13) + 1)) + st.slice(13);
      lines.push('DTSTART:' + icsDT(st), 'DTEND:' + icsDT(en > st ? en : st));
    }
    if (it.place) lines.push('LOCATION:' + icsEscape(it.place));
    if (it.lat != null && it.lng != null) lines.push('GEO:' + it.lat + ';' + it.lng);
    if (desc) lines.push('DESCRIPTION:' + icsEscape(desc));
    lines.push('CATEGORIES:' + icsEscape(k.label), 'END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.map(icsFold).join('\r\n') + '\r\n';
}
function exportIcs(){
  if (!cur || !cur.items.length){ toast('Engin færsla til að flytja út.'); return; }
  const blob = new Blob([buildIcs()], { type:'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = (cur.trip.title || 'ferd').replace(/[^\wáéíóúýþæðöÁÉÍÓÚÝÞÆÐÖ -]/g,'').trim().replace(/\s+/g,'-') + '.ics';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Dagatalsskrá sótt. Opnaðu hana til að bæta í dagatalið.');
}

/* ---------- klukka: staðartími á áfangastað og heima ---------- */
let clockTimer = null;
const COMMON_TZ = ['America/Cancun','America/Mexico_City','Europe/London','Europe/Copenhagen','Europe/Stockholm','Europe/Oslo','Europe/Madrid','Europe/Lisbon','Europe/Paris','Europe/Berlin','Europe/Rome','Europe/Athens','America/New_York','America/Toronto','America/Chicago','America/Denver','America/Los_Angeles','Atlantic/Canary','Asia/Bangkok','Asia/Tokyo','Asia/Dubai','Australia/Sydney','Africa/Johannesburg'];
const homeTz = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e){ return 'Atlantic/Reykjavik'; } };
const fmtClock = tz => { try { return new Intl.DateTimeFormat('is-IS', { timeZone: tz, hour:'2-digit', minute:'2-digit', hour12: false }).format(new Date()); } catch(e){ return null; } };
const tzLabel = tz => (tz || '').split('/').pop().replace(/_/g, ' ');
function renderClock(){
  clearInterval(clockTimer);
  const old = $('#clock'); if (old) old.remove();
  const tz = cur && cur.trip && cur.trip.tz; if (!tz) return;
  const home = homeTz(); if (tz === home) return;
  const node = el('span', {class:'clock', id:'clock'});
  const paint = () => { const a = fmtClock(tz), b = fmtClock(home); if (!a) return; node.innerHTML = `<span>${esc(tzLabel(tz))} <b>${a}</b></span><span>Heima <b>${b}</b></span>`; };
  paint(); $('#userbar').append(node);
  clockTimer = setInterval(paint, 30000);
}

/* ---------- prentvæn útgáfa ---------- */
function buildPrint(){
  const { trip } = cur; const owner = isOwner();
  const h = [];
  h.push(`<h1>${esc(trip.title)}</h1><div>${esc(fmtRange(trip.start, trip.end))}${trip.description ? ' · ' + esc(trip.description) : ''}</div>`);
  h.push('<h2>Dagur fyrir dag</h2>');
  for (const day of allDays()){
    const d = parse(day);
    const todays = cur.items.filter(i => i.kind !== 'hotel' && dpart(i.start) === day).sort((a,b) => a.start.localeCompare(b.start));
    const stay = stayOn(day);
    if (!todays.length && !stay) continue;
    h.push(`<div class="pday"><h3>${DOW[dow(d)]} ${d.getDate()}. ${MONTH[d.getMonth()]}${stay ? ` <small>· gisting: ${esc(stay.title)}</small>` : ''}</h3>`);
    for (const it of todays){
      const bits = [tpart(it.start) + (it.end ? ' til ' + (dpart(it.end) !== dpart(it.start) ? parse(it.end).getDate() + '. ' + MONTH_S[parse(it.end).getMonth()] + ' ' : '') + tpart(it.end) : ''), kindOf(it.kind).label, it.flightNo, it.place, owner && it.conf ? 'bókun ' + it.conf : null, it.price, it.note].filter(Boolean).map(esc);
      h.push(`<div class="pit"><b>${esc(it.title)}</b><br><small>${bits.join(' · ')}</small></div>`);
    }
    h.push('</div>');
  }
  const hs = cur.items.filter(i => i.kind === 'hotel');
  if (hs.length){
    h.push('<h2>Gisting</h2><table><tr><th>Hótel</th><th>Inn</th><th>Út</th><th>Heimilisfang</th>' + (owner ? '<th>Bókun</th>' : '') + '</tr>');
    for (const x of hs) h.push(`<tr><td>${esc(x.title)}</td><td>${esc(fmtD(x.start))} ${esc(tpart(x.start))}</td><td>${x.end ? esc(fmtD(x.end)) + ' ' + esc(tpart(x.end)) : ''}</td><td>${esc(x.place || '')}${x.note ? '<br><small>' + esc(x.note) + '</small>' : ''}</td>` + (owner ? `<td>${esc(x.conf || '')}</td>` : '') + '</tr>');
    h.push('</table>');
  }
  if (owner){
    const info = Object.values((cur.priv && cur.priv._info) || {}).sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
    if (info.length){
      h.push('<h2>Mikilvægt</h2><table>');
      for (const r of info) h.push(`<tr><th>${esc(r.label)}</th><td>${esc(r.value)}</td></tr>`);
      h.push('</table>');
    }
  }
  h.push(`<p class="pnote">Prentað ${new Date().getDate()}. ${MONTH[new Date().getMonth()]} ${new Date().getFullYear()} af www.multabene.is/travel/. Tímar eru staðartími áfangastaðar.</p>`);
  return h.join('');
}
function printTrip(){
  if (!cur || !cur.trip) return;
  $('#print').innerHTML = buildPrint();
  setTimeout(() => window.print(), 50);
}

/* ---------- pökkunarlisti: sameiginlegur, allir með hlekk geta hakað og bætt við ---------- */
const PACK_CATS = ['Föt', 'Snyrtivörur', 'Skjöl og peningar', 'Rafmagn', 'Lyf', 'Annað'];
const PACK_TEMPLATE = {
  'Skjöl og peningar': ['Vegabréf', 'Greiðslukort', 'Reiðufé', 'Ferðatrygging, skírteini', 'Útprentuð áætlun'],
  'Rafmagn': ['Hleðslutæki fyrir síma', 'Hleðslubanki', 'Millistykki fyrir innstungur', 'Heyrnartól'],

function renderPacking(host){
  const items = cur.packing;
  const done = items.filter(x => x.done).length;
  host.append(el('p', {class:'help', style:'margin:0 0 10px'}, 'Sameiginlegur listi fyrir alla með hlekkinn. Hakið við þegar pakkað er. Merktu hlut með nafni ef hann er bara fyrir eina.'));
  if (items.length){
    const bar = el('div', {class:'progress'}); bar.append(el('i', {style:`width:${Math.round(done / items.length * 100)}%`}));
    host.append(el('div', {style:'margin:0 0 14px'}, el('div', {class:'help'}, `${done} af ${items.length} pakkað`), bar));
  }
  const hideDone = store.get('travel:packhide', false);
  const wrap = el('div', {class:'pack'});
  if (!items.length){
    wrap.append(el('p', {class:'empty'}, 'Listinn er tómur.'));
    wrap.append(el('div', {class:'row'}, el('button', {class:'btn small', type:'button', onclick: addTemplate}, 'Setja inn grunnlista'), el('button', {class:'btn ghost small', type:'button', onclick: () => openPackDialog()}, 'Bæta við sjálf')));

/* ---------- kostnaður: les upphæð og gjaldmiðil úr frjálsum texta ----------
   Dæmi: "121.384,00 kr.", "US$905.62", "USD 1,007.45", "$812.67", "257,84 CAD", "4.200 MXN" */
const CUR_PATTERNS = [
  ['ISK', /\bISK\b|kr\.?(?![a-záðéíóúýþæö])/i],
  ['USD', /US\$|\bUSD\b/i],
  ['CAD', /CA\$|C\$|\bCAD\b/i],
  ['MXN', /MX\$|MXN|\bpesos?\b/i],
  ['EUR', /€|\bEUR\b/i],
  ['GBP', /£|\bGBP\b/i],
  ['DKK', /\bDKK\b/i], ['NOK', /\bNOK\b/i], ['SEK', /\bSEK\b/i]
];
function parsePrice(str){
  if (!str) return null;
  let cur = null;
  for (const [c, re] of CUR_PATTERNS) if (re.test(str)){ cur = c; break; }
  if (!cur && /\$/.test(str)) cur = 'USD';
  const m = str.replace(/\s/g, '').match(/\d[\d.,]*\d|\d/);
  if (!m) return null;
  let num = m[0];
  const lastDot = num.lastIndexOf('.'), lastComma = num.lastIndexOf(',');
  let dec = null;
  if (lastDot >= 0 && lastComma >= 0) dec = lastDot > lastComma ? '.' : ',';
  else if (lastDot >= 0 || lastComma >= 0){
    const sep = lastDot >= 0 ? '.' : ',';
    const after = num.length - 1 - Math.max(lastDot, lastComma);
    const count = num.split(sep).length - 1;
    dec = (after === 2 && count === 1) ? sep : null;      /* "257,84" er tugabrot, "121.384" er þúsund */
  }
  let amount;
  if (dec){ const other = dec === '.' ? ',' : '.'; amount = parseFloat(num.split(other).join('').replace(dec, '.')); }
  else amount = parseFloat(num.replace(/[.,]/g, ''));
  if (!isFinite(amount)) return null;
  if (!cur) cur = 'ISK';
  return { amount, cur };
}
const fmtAmt = (n, cur) => cur === 'ISK' || cur === 'MXN' && n >= 1000 ? Math.round(n).toLocaleString('de-DE') : n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/* Gengi dagsins: Seðlabanki Evrópu (frankfurter.dev), varaleið open.er-api.com. Geymt í síma í 12 klst. */
let fxState = { rates: null, date: null, loading: false, failed: false };
async function fetchRates(){
  const cached = store.get('travel:fx', null);
  if (cached && Date.now() - cached.at < 12 * 3600 * 1000){ fxState = { rates: cached.rates, date: cached.date, loading: false, failed: false }; return fxState; }
  fxState.loading = true;
  const want = ['USD','CAD','MXN','EUR','GBP','DKK','NOK','SEK'];
  try {
    let rates = {}, date = null;
    try {
      const r = await fetch(`https://api.frankfurter.dev/v1/latest?base=ISK&symbols=${want.join(',')}`);
      if (!r.ok) throw new Error('fx');
      const j = await r.json();
      for (const c of want) if (j.rates && j.rates[c]) rates[c] = 1 / j.rates[c];
      date = j.date;
    } catch(e){
      const r = await fetch('https://open.er-api.com/v6/latest/ISK');
      if (!r.ok) throw new Error('fx2');
      const j = await r.json();
      for (const c of want) if (j.rates && j.rates[c]) rates[c] = 1 / j.rates[c];
      date = (j.time_last_update_utc || '').slice(0, 16);
    }
    if (!Object.keys(rates).length) throw new Error('empty');
    fxState = { rates, date, loading: false, failed: false };
    store.set('travel:fx', { rates, date, at: Date.now() });
  } catch(e){ fxState = { rates: null, date: null, loading: false, failed: true }; }
  return fxState;
}
function renderCosts(host){
  const manual = (cur.trip.rates) || {};
  const auto = fxState.rates || {};
  const rates = { ...auto, ...manual };
  const toIsk = p => p.cur === 'ISK' ? p.amount : (rates[p.cur] ? p.amount * rates[p.cur] : null);
  /* flokka eftir gerð, svo eftir gjaldmiðli */
  const groups = {}, bad = [], allCur = new Set();
  let total = 0, missing = false;
  for (const it of cur.items){
    if (!it.price) continue;
    const p = parsePrice(it.price);
    if (!p){ bad.push(it); continue; }
    allCur.add(p.cur);
    const g = groups[it.kind] || (groups[it.kind] = { byCur: {}, isk: 0, missing: false, n: 0 });
    g.byCur[p.cur] = (g.byCur[p.cur] || 0) + p.amount; g.n++;
    const isk = toIsk(p);
    if (isk == null){ g.missing = true; missing = true; } else { g.isk += isk; total += isk; }
  }
  const card = el('div', {class:'card'}, el('h2', {}, 'Kostnaður'));
  const order = ['hotel','flight','move','act','note'];
  const kinds = order.filter(k => groups[k]);
  if (!kinds.length && !bad.length){ card.append(el('p', {class:'empty'}, 'Engin verð skráð enn. Verðreiturinn á færslum má vera í hvaða rithætti sem er, til dæmis "121.384 kr.", "US$905.62" eða "257,84 CAD".')); host.append(card); return; }
  const list = el('div', {class:'info-view'});
  for (const k of kinds){
    const g = groups[k];
    const curs = Object.keys(g.byCur).sort();
    const parts = curs.map(c => `${fmtAmt(g.byCur[c], c)} ${c}`).join(' + ');
    list.append(el('div', {class:'kv'},
      el('b', {}, `${kindOf(k).label} (${g.n})`),
      el('span', {}, parts),
      el('span', {style:'font-weight:700;white-space:nowrap'}, g.missing ? `≥ ${fmtAmt(g.isk, 'ISK')} kr.` : `${fmtAmt(g.isk, 'ISK')} kr.`)));
  }
  card.append(list);
  card.append(el('p', {style:'margin:12px 0 0;font-weight:700;font-size:17px'}, `Samtals ${missing ? 'að minnsta kosti ' : ''}${fmtAmt(total, 'ISK')} kr.` + (missing ? ' (gengi vantar fyrir hluta)' : '')));
  /* gengi */
  const foreign = [...allCur].filter(c => c !== 'ISK').sort();
  const foreignNow = foreign.filter(c => !rates[c]);
  if (foreignNow.length && !fxState.loading && !fxState.failed){ fetchRates().then(() => { if (cur && cur.tab === 'stillingar') renderTrip(); }); }
  if (foreign.length){
    const src = fxState.loading && foreignNow.length ? 'Sæki gengi dagsins…' : fxState.date ? `Gengi Seðlabanka Evrópu, ${fxState.date}. Sótt sjálfkrafa.` : fxState.failed ? 'Náði ekki í gengi dagsins. Skráðu gengi hér fyrir neðan.' : '';
    if (src) card.append(el('p', {class:'help', style:'margin:8px 0 0'}, src + ' ' + foreign.filter(c => rates[c]).map(c => `1 ${c} = ${rates[c].toFixed(2)} kr.${manual[c] ? ' (þitt gengi)' : ''}`).join(' · ')));
    const det = el('details', {style:'margin-top:12px'});
    det.append(el('summary', {style:'cursor:pointer;color:var(--dim);font-size:14px'}, 'Nota eigið gengi í stað gengis dagsins'));
    const f = el('form', {class:'form', style:'margin-top:10px'});
    f.append(el('div', {class:'full help'}, 'Til dæmis gengið sem kortið þitt notaði. Tómt = gengi dagsins. Gildir aðeins fyrir þessa ferð.'));
    const inputs = {};
    for (const c of foreign){ inputs[c] = el('input', {type:'number', step:'0.01', min:'0', placeholder: auto[c] ? auto[c].toFixed(2) : 'kr. fyrir 1 ' + c, value: manual[c] || ''}); f.append(el('label', {}, `1 ${c} =`, inputs[c])); }
    const st = el('p', {class:'status'});
    f.append(el('div', {class:'row'}, el('button', {class:'btn small', type:'submit'}, 'Vista gengi')), st);
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const r = {}; for (const c of foreign){ const v = parseFloat(inputs[c].value); if (v > 0) r[c] = v; }
      try { await db.ref(`travel/trips/${cur.id}/rates`).set(Object.keys(r).length ? r : null); toast('Gengi vistað'); } catch(err){ st.textContent = 'Vistun tókst ekki.'; st.classList.add('err'); }
    });
    det.append(f); card.append(det);
  }
  if (bad.length) card.append(el('p', {class:'help', style:'margin-top:10px'}, 'Skildi ekki verðið á: ' + bad.map(b => `"${b.price}" (${b.title})`).join(', ') + '. Skrifaðu tölu og gjaldmiðil, til dæmis "905.62 USD".'));
  host.append(card);
}

function renderSettings(host){
  const sug = Object.entries(cur.suggestions).sort((a,b) => (a[1].created || '').localeCompare(b[1].created || ''));
  const sc = el('div', {class:'card'}, el('h2', {}, 'Tillögur'), el('p', {class:'help', style:'margin:0 0 10px'}, 'Samferðafólk með hlekkinn getur sent tillögu. Þú setur hana á dagskrá á þeim degi sem tillagan nefnir, geymir hana í hugmyndabankanum til að ákveða daginn síðar, eða hafnar henni.'));
  if (!sug.length) sc.append(el('p', {class:'empty'}, 'Engin tillaga bíður.'));
  for (const [sid, s] of sug){
    const c = itemCard({ ...s, title: s.title }, false);
    c.querySelector('.kind').textContent = `${kindOf(s.kind).label} · tillaga frá ${s.by || 'gesti'}`;
    const acts = c.querySelector('.acts'); acts.querySelectorAll('button').forEach(b => b.remove());
    acts.append(
      el('button', {class:'btn small', type:'button', title:'Setja færsluna inn í áætlunina á þeim degi sem tillagan nefnir', onclick: async () => {
        const { by, created, conf, price, ...item } = s;
        const nid = rnd(12);
        try { await db.ref().update({ [`travel/trips/${cur.id}/items/${nid}`]: item, [`travel/private/${cur.id}/${nid}`]: { conf: conf || null, price: price || null }, [`travel/trips/${cur.id}/suggestions/${sid}`]: null }); toast('Tillaga komin á dagskrá'); } catch(e){ toast('Tókst ekki.'); }
      }}, 'Á dagskrá'),
      el('button', {class:'btn ghost small', type:'button', title:'Geyma í hugmyndabankanum og ákveða daginn síðar', onclick: async () => {
        const idea = { title: s.title, place: s.place || null, lat: s.lat ?? null, lng: s.lng ?? null, placeId: s.placeId || null, url: s.url || null, note: s.note || null, by: s.by || 'gesti', created: new Date().toISOString() };
        try { await db.ref().update({ [`travel/trips/${cur.id}/ideas/${rnd(12)}`]: idea, [`travel/trips/${cur.id}/suggestions/${sid}`]: null }); toast('Tillaga komin í hugmyndabankann'); } catch(e){ toast('Tókst ekki.'); }
      }}, 'Í hugmyndabanka'),
      el('button', {class:'btn ghost small', type:'button', onclick: async () => { try { await db.ref(`travel/trips/${cur.id}/suggestions/${sid}`).remove(); toast('Tillögu hafnað'); } catch(e){ toast('Tókst ekki.'); } }}, 'Hafna'));
    sc.append(c);
  }
  host.append(sc);

  const share = `${BASE}#t/${cur.id}`;
  const shc = el('div', {class:'card'}, el('h2', {}, 'Deila ferð'), el('p', {class:'help'}, 'Þeir sem fá hlekkinn sjá allt án innskráningar og geta sent tillögu. Þeir geta ekki breytt.'),
    el('div', {class:'share-box'}, share),
    el('div', {class:'row'}, el('button', {class:'btn small', type:'button', onclick: () => copy(share, 'Hlekkur afritaður')}, 'Afrita'),
      navigator.share ? el('button', {class:'btn ghost small', type:'button', onclick: () => navigator.share({ title: cur.trip.title, url: share }).catch(() => {})}, 'Deila…') : null));
  host.append(shc);
  const nPriv = Object.entries(cur.priv || {}).filter(([k, x]) => k !== '_info' && x && (x.conf || x.price)).length;
  const nPub = Object.values(cur.trip.items || {}).filter(x => x && (x.conf || x.price)).length;
  host.append(el('div', {class:'card'}, el('h2', {}, 'Bókunarnúmer og verð'),
    el('p', {class:'help'}, `Einkahólf: ${cur.privOk === true ? 'opið' : cur.privOk === false ? 'lokað (' + (cur.privErr || '') + ')' : 'ekki svarað enn'}. Bókunarnúmer og verð: ${nPriv} ${nPriv === 1 ? 'færsla' : 'færslur'} í einkahólfi, ${nPub} í opna hlutanum. Gestir sjá aðeins opna hlutann.`)));
  renderCosts(host);
  host.append(el('div', {class:'card'}, el('h2', {}, 'Dagatal símans'),
    el('p', {class:'help', style:'margin:0 0 10px'}, 'Sækir ics-skrá með öllum færslum. Opnaðu hana í símanum og veldu að bæta í dagatalið. Tímar eru staðartími áfangastaðar. Skráin uppfærist ekki sjálfkrafa, sæktu hana aftur eftir breytingar.'),
    el('button', {class:'btn small', type:'button', onclick: exportIcs}, 'Sækja í dagatal (.ics)')));
  host.append(tripForm(cur.trip));
}

/* ---------- færsla: nýtt, breyta, tillaga ---------- */
function openItemDialog(it, asSuggestion, opts={}){
  const dlg = $('#dlg'), inner = $('#dlgInner'); inner.innerHTML = '';
  const isNew = !it || !it.id;
  inner.append(el('h2', {}, asSuggestion ? 'Senda tillögu' : isNew ? 'Ný færsla' : 'Breyta færslu'));
  if (asSuggestion) inner.append(el('p', {class:'help', style:'margin:0 0 12px'}, 'Tillagan fer til eiganda ferðarinnar sem samþykkir hana eða hafnar.'));
  const f = el('form', {class:'form'});
  const v = it || { kind:'act', start: (cur.trip.start || todayIso()) + 'T10:00', end:'' };
  const kind = el('select', {id:'iKind'});
  for (const k in KINDS) kind.append(el('option', {value:k, selected: v.kind === k ? '' : null}, KINDS[k].label));
  const title = el('input', {id:'iTitle', maxlength:'100', required:'', placeholder:'t.d. Hotel Playa Norte', value: v.title || ''});
  const start = el('input', {id:'iStart', type:'datetime-local', required:'', value: v.start || ''});
  const end = el('input', {id:'iEnd', type:'datetime-local', value: v.end || '', min: v.start || null});
  /* Lok mega ekki vera á undan byrjun. Tóm lok fá sjálfgefið gildi:
     gisting næsta dag kl. 11:00, annað tveimur tímum síðar. */
  const addMinutes = (dt, mins) => { const d = new Date(dt); if (isNaN(d)) return ''; d.setMinutes(d.getMinutes() + mins); return `${iso(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  start.addEventListener('change', () => {
    if (!start.value) return;
    end.min = start.value;
    if (!end.value || end.value < start.value){
      end.value = kind.value === 'hotel' ? dpart(addMinutes(start.value, 24*60)) + 'T11:00' : addMinutes(start.value, 120);
    }
  });
  const place = el('input', {id:'iPlace', maxlength:'200', placeholder: MAPS_READY ? 'Leitaðu að stað eða heimilisfangi' : 'Heiti staðar eða heimilisfang', value: v.place || '', autocomplete:'off'});
  const gl = el('input', {id:'iLink', placeholder:'Límdu hlekk úr Google Maps, eða hnit', value:''});
  const conf = el('input', {id:'iConf', maxlength:'60', placeholder:'Bókunarnúmer', value: v.conf || ''});
  const flightNo = el('input', {id:'iFlight', maxlength:'10', placeholder:'t.d. FI 681', value: v.flightNo || '', autocapitalize:'characters'});
  const flightLabel = el('label', {}, 'Flugnúmer', flightNo);
  const price = el('input', {id:'iPrice', maxlength:'40', placeholder:'t.d. 4.200 MXN', value: v.price || ''});
  const url = el('input', {id:'iUrl', type:'url', placeholder:'https://…', value: v.url || ''});
  const note = el('textarea', {id:'iNote', rows:'3', maxlength:'600'}); note.value = v.note || '';
  const by = el('input', {id:'iBy', maxlength:'40', placeholder:'Nafnið þitt', value: store.get('travel:name', '')});
  let loc = { lat: v.lat ?? null, lng: v.lng ?? null, placeId: v.placeId || null };
  const locInfo = el('span', {class:'help', style:'font-size:12px'});
  const paintLoc = () => { locInfo.textContent = loc.lat != null ? `Staðsetning á korti: ${(+loc.lat).toFixed(4)}, ${(+loc.lng).toFixed(4)}` : 'Engin staðsetning á korti enn.'; };
  paintLoc();
  gl.addEventListener('input', () => { const c = coordsFromLink(gl.value); if (c){ loc = { ...c, placeId: null }; paintLoc(); } });
  place.addEventListener('input', () => { if (!MAPS_READY) return; });

  const kindLabel = el('label', {}, 'Gerð', kind);
  const endLabel = el('label', {}, 'Endar', end);
  const paintKind = () => { const h = kind.value === 'hotel'; endLabel.firstChild.textContent = h ? 'Útritun' : 'Endar'; f.querySelector('#iStartL').firstChild.textContent = h ? 'Innritun' : 'Byrjar'; flightLabel.hidden = kind.value !== 'flight'; };
  kind.addEventListener('change', paintKind);
  const placeWrap = el('label', {class:'full'}, 'Staður', place);
  f.append(
    kindLabel,
    el('label', {class:'full'}, 'Heiti', title),
    el('label', {id:'iStartL'}, 'Byrjar', start),
    endLabel,
    placeWrap,
    el('label', {class:'full'}, 'Google Maps hlekkur eða hnit (valkvætt)', gl),
    el('div', {class:'full'}, locInfo),
    flightLabel,
    asSuggestion ? null : el('label', {}, 'Bókunarnúmer', conf),
    el('label', {}, 'Verð', price),
    el('label', {class:'full'}, 'Hlekkur á bókun', url),
    el('label', {class:'full'}, 'Athugasemd', note)
  );
  if (asSuggestion) f.prepend(el('label', {class:'full'}, 'Frá hverjum', by));
  const st = el('p', {class:'status'});
  const row = el('div', {class:'row'},
    el('button', {class:'btn', type:'submit'}, asSuggestion ? 'Senda tillögu' : 'Vista'),
    el('button', {class:'btn ghost', type:'button', onclick: () => dlg.close()}, 'Hætta við'));
  if (!isNew && !asSuggestion) row.append(el('button', {class:'btn danger', type:'button', style:'margin-left:auto', onclick: async () => {
    if (!confirm(`Eyða "${it.title}"?`)) return;
    try { await db.ref().update({ [`travel/trips/${cur.id}/items/${it.id}`]: null, [`travel/private/${cur.id}/${it.id}`]: null }); dlg.close(); toast('Færslu eytt'); } catch(e){ st.textContent = 'Tókst ekki að eyða.'; st.classList.add('err'); }
  }}, 'Eyða'));
  f.append(row, st);
  inner.append(f);
  dlg.showModal();
  paintKind();

  /* Google staðaleit, nýja vefeiningin */
  if (MAPS_READY){
    loadMaps().then(async () => {
      if (!google.maps.places || !google.maps.places.PlaceAutocompleteElement) return;
      try { await google.maps.importLibrary('places'); } catch(e){}
      const pac = new google.maps.places.PlaceAutocompleteElement();
      pac.id = 'iPac';
      placeWrap.firstChild.textContent = 'Staður (leit)';
      place.hidden = true;
      placeWrap.append(pac);
      const onPick = async (ev) => {
        try {
          const p = ev.placePrediction ? ev.placePrediction.toPlace() : ev.place;
          await p.fetchFields({ fields: ['displayName','formattedAddress','location','id'] });
          const name = p.displayName || ''; const addr = p.formattedAddress || '';
          place.value = name && addr && !addr.startsWith(name) ? `${name}, ${addr}` : (addr || name);
          loc = { lat: p.location.lat(), lng: p.location.lng(), placeId: p.id || null };
          paintLoc();
          if (!title.value.trim() && name) title.value = name;
        } catch(e){ toast('Náði ekki í staðinn.'); }
      };
      pac.addEventListener('gmp-select', onPick);
      pac.addEventListener('gmp-placeselect', onPick);
    }).catch(() => {});
  }

  f.addEventListener('submit', async e => {
    e.preventDefault(); st.className = 'status';
    const data = {
      kind: kind.value, title: title.value.trim(), start: start.value, end: end.value || null, place: place.value.trim() || null,
      lat: loc.lat != null ? +loc.lat : null, lng: loc.lng != null ? +loc.lng : null, placeId: loc.placeId || null,
      conf: conf.value.trim() || null, price: price.value.trim() || null, url: url.value.trim() || null, note: note.value.trim() || null,
      flightNo: kind.value === 'flight' ? (flightNo.value.trim().toUpperCase() || null) : null,
      ideaId: opts.ideaId || v.ideaId || null
    };
    if (!data.title || !data.start){ st.textContent = 'Heiti og byrjun þarf.'; st.classList.add('err'); return; }
    if (data.end && data.end < data.start){ st.textContent = 'Lok eru á undan byrjun.'; st.classList.add('err'); return; }
    if (data.kind === 'hotel' && !data.end){ st.textContent = 'Gisting þarf útritunardag.'; st.classList.add('err'); return; }
    st.textContent = 'Vistar…';
    try {
      if (asSuggestion){
        const name = by.value.trim() || 'gestur'; store.set('travel:name', name);
        await db.ref(`travel/trips/${cur.id}/suggestions`).push({ ...data, by: name, created: new Date().toISOString() });
        dlg.close(); toast('Tillaga send. Eigandi ferðarinnar fær hana til samþykktar.');
      } else {
        const iid = isNew ? rnd(12) : it.id;
        const { conf: confVal, price: priceVal, ...pub } = data;
        const upd = { [`travel/trips/${cur.id}/items/${iid}`]: pub, [`travel/private/${cur.id}/${iid}`]: { conf: confVal || null, price: priceVal || null } };
        if (opts.ideaId) upd[`travel/trips/${cur.id}/ideas/${opts.ideaId}/scheduled`] = iid;
        await db.ref().update(upd);
        dlg.close(); toast(opts.ideaId ? 'Hugmynd komin á dagskrá' : 'Vistað');
      }
    } catch(err){ st.textContent = 'Vistun tókst ekki: ' + (err.code || err.message); st.classList.add('err'); }
  });
}

/* ------------------------------------------------------------------
   Ræsing
------------------------------------------------------------------ */
let firstLoad = true;
function go(){
  /* Fyrsta opnun án slóðar, til dæmis úr heimaskjásappi: fara beint í síðustu ferð */
  if (firstLoad){
    firstLoad = false;
    const last = store.get('travel:last', null);
    if (!location.hash && last && store.get(`travel:cache:${last}`, null)){ location.hash = `#t/${last}`; return; }
  }
  const r = route();
  if (r.view === 'home'){ const f = $('#fab'); if (f) f.remove(); renderHome(); renderUserbar(); }
  else openTrip(r);
}
window.addEventListener('hashchange', go);
if (!auth) go();

/* Án nets: service worker geymir síðuna sjálfa, localStorage geymir ferðina */
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('/travel/sw.js').catch(() => {});
}
function paintOnline(){ if (cur && cur.trip) renderTrip(); }
window.addEventListener('online', paintOnline);
window.addEventListener('offline', paintOnline);
</script>
